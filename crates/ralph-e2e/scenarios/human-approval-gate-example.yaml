# human-approval-gate-example 声明化(候选6)
id: parallel-human-approval-gate-example
description: Directly runs examples/parallel-human-approval-gate and injects approval.granted after approval.requested (declarative)
tier: "Tier 8: Parallel Runtime"
backends: [codex]
setup:
  example: parallel-human-approval-gate
  max_iterations: 20
  timeout_secs: 360
  extra_args: ["--no-tui"]
  inject:
    - type: wait_event
      topic: approval.requested
      timeout_secs: 180
    - type: emit
      topic: approval.granted
      payload: '{"approved_by":"release-manager","window":"2026-03-10 10:00 UTC"}'
      json_payload: true
      target_instance: ralph#1
      # 会话定向: 避免 ralph#1 busy 时被 rewrite_target_for_busy_ralph 改投 ralph#2,
      # 否则 ralph#1 收不到审批, 流程无法收敛。
      session_strategy: app_server
expect:
  response_received: true
  exit_code_success_or_limit: true
  no_timeout: true
  output_contains:
    - "[supervisor] instances"
  events:
    - topic: deployment.plan.check
      min_count: 1
    - topic: rollback.plan.check
      min_count: 1
    - topic: comms.plan.check
      min_count: 1
    - topic: deployment.checked
      min_count: 1
    - topic: rollback.checked
      min_count: 1
    - topic: comms.checked
      min_count: 1
    - topic: approval.requested
      min_count: 1
    - topic: approval.granted
      min_count: 1
    - topic: deployment.ready
      min_count: 1
  event_order:
    - approval.requested
    - approval.granted
    - deployment.ready
  event_payload_contains:
    - topic: deployment.ready
      contains: rollout-2026-03-10-01
  no_jobs_after_loop_complete: true
  agents_snapshot:
    min_instances: 3
    hat_ids: [deploy_checker, rollback_checker, comms_checker]
