# events 声明化 (Tier 3, declarative YAML)
id: events
description: Verifies event parsing via XML emission (declarative)
tier: "Tier 3: Events"
backends: [claude, kiro, opencode, codex]
setup:
  config: |
    # Event parsing test config
    cli:
      backend: {backend}

    event_loop:
      max_iterations: 1
      completion_promise: "LOOP_COMPLETE"
  prompt: |
    You are testing Ralph's event parsing system.

    Your task is to emit a specific event using the XML format:
    <event topic="test.event">Test payload data</event>

    After emitting the event, output LOOP_COMPLETE to signal completion.

    Do exactly this:
    1. Output the event XML above
    2. Output LOOP_COMPLETE

    Nothing else.
  max_iterations: 1
expect:
  response_received: true
  exit_code_success_or_limit: true
  no_timeout: true
  events:
    - topic: test.event
      min_count: 1
  event_payload_contains:
    - topic: test.event
      contains: "Test payload"
