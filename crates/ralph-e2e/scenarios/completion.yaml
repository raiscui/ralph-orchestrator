# completion 声明化 (Tier 2, declarative YAML)
id: completion
description: Verifies completion promise detection (declarative)
tier: "Tier 2: Orchestration Loop"
backends: [claude, kiro, opencode, codex]
setup:
  config: |
    # Completion detection test config
    cli:
      backend: {backend}

    event_loop:
      max_iterations: 5
      completion_promise: "LOOP_COMPLETE"
  prompt: |
    You are testing Ralph's completion detection.

    Your ONLY task is to output the completion signal LOOP_COMPLETE.

    IMPORTANT: Ralph uses dual-confirmation. You MUST output LOOP_COMPLETE in this response
    and in any subsequent responses until the loop terminates.

    Output LOOP_COMPLETE now:
    LOOP_COMPLETE

    Keep outputting LOOP_COMPLETE until the orchestration ends.
  max_iterations: 5
expect:
  response_received: true
  exit_code_success_or_limit: true
  no_timeout: true
  termination: LOOP_COMPLETE
