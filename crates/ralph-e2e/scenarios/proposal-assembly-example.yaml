# proposal_assembly 声明化(候选6)
id: parallel-proposal-assembly-example
description: Directly runs examples/parallel-proposal-assembly and asserts proposal lanes converge into proposal.ready (declarative) (declarative)
tier: "Tier 8: Parallel Runtime"
backends: [codex]
setup:
  example: parallel-proposal-assembly
  max_iterations: 18
  timeout_secs: 300
  extra_args: ["--no-tui"]
expect:
  response_received: true
  exit_code_success_or_limit: true
  no_timeout: true
  output_contains:
    - "[supervisor] instances"
  events:
    - topic: proposal.research.task
      min_count: 1
    - topic: proposal.pricing.task
      min_count: 1
    - topic: proposal.legal.task
      min_count: 1
    - topic: proposal.exec.task
      min_count: 1
    - topic: research.done
      min_count: 1
    - topic: pricing.done
      min_count: 1
    - topic: legal.done
      min_count: 1
    - topic: exec.done
      min_count: 1
    - topic: proposal.merge.request
      min_count: 1
    - topic: proposal.ready
      min_count: 1
  event_payload_contains:
    - topic: proposal.ready
      contains: "recommendation: SUBMIT"
  event_absent_prefixes:
    - "gate."
  event_absent:
    - approval.requested
  no_jobs_after_loop_complete: true
  agents_snapshot:
    min_instances: 5
    hat_ids: [executive_writer, legal_reviewer, pricing_analyst, proposal_editor, research_analyst]
