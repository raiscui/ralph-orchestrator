# field_enablement_rollout 声明化(候选6)
id: parallel-field-enablement-rollout-example
description: Directly runs examples/parallel-field-enablement-rollout and asserts enablement lanes converge into enablement.rollout.ready (declarative) (declarative)
tier: "Tier 8: Parallel Runtime"
backends: [codex]
setup:
  example: parallel-field-enablement-rollout
  max_iterations: 18
  timeout_secs: 300
  extra_args: ["--no-tui"]
expect:
  response_received: true
  exit_code_success_or_limit: true
  no_timeout: true
  output_contains:
    - "[supervisor] instances"
  events:
    - topic: enablement.curriculum.review
      min_count: 1
    - topic: enablement.demo.environment.review
      min_count: 1
    - topic: enablement.manager.briefing.review
      min_count: 1
    - topic: enablement.certification.plan.review
      min_count: 1
    - topic: curriculum.ready
      min_count: 1
    - topic: demo.ready
      min_count: 1
    - topic: briefing.ready
      min_count: 1
    - topic: certification.ready
      min_count: 1
    - topic: enablement.rollout.packet.request
      min_count: 1
    - topic: enablement.rollout.ready
      min_count: 1
  event_payload_contains:
    - topic: enablement.rollout.ready
      contains: "rollout_status: READY_TO_ROLLOUT"
  event_absent_prefixes:
    - "gate."
  event_absent:
    - approval.requested
  no_jobs_after_loop_complete: true
  agents_snapshot:
    min_instances: 5
    hat_ids: [certification_tracker, curriculum_designer, demo_environment_owner, manager_briefing_owner, rollout_conductor]
