# support_escalation_desk 声明化(候选6)
id: parallel-support-escalation-desk-example
description: Directly runs examples/parallel-support-escalation-desk and asserts escalation lanes converge into escalation.plan.ready (declarative)
tier: "Tier 8: Parallel Runtime"
backends: [codex]
setup:
  example: parallel-support-escalation-desk
  max_iterations: 18
  timeout_secs: 300
  extra_args: ["--no-tui"]
expect:
  response_received: true
  exit_code_success_or_limit: true
  no_timeout: true
  output_contains:
    - "[supervisor] instances"
  events:
    - topic: support.case.triage.review
      min_count: 1
    - topic: support.product.assessment.review
      min_count: 1
    - topic: support.account.context.review
      min_count: 1
    - topic: support.comms.plan.review
      min_count: 1
    - topic: case.ready
      min_count: 1
    - topic: product.ready
      min_count: 1
    - topic: account.ready
      min_count: 1
    - topic: comms.ready
      min_count: 1
    - topic: support.escalation.plan.request
      min_count: 1
    - topic: escalation.plan.ready
      min_count: 1
  event_payload_contains:
    - topic: escalation.plan.ready
      contains: "escalation_status: READY_FOR_EXECUTION"
  event_absent_prefixes:
    - "gate."
  event_absent:
    - approval.requested
  no_jobs_after_loop_complete: true
  agents_snapshot:
    min_instances: 5
    hat_ids: [account_risk_manager, case_triage_owner, comms_coordinator, escalation_director, product_bug_reviewer]
