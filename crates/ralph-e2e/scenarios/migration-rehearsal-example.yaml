# migration_rehearsal 声明化(候选6)
id: parallel-migration-rehearsal-example
description: Directly runs examples/parallel-migration-rehearsal and asserts rehearsal lanes converge into migration.ready (declarative)
tier: "Tier 8: Parallel Runtime"
backends: [codex]
setup:
  example: parallel-migration-rehearsal
  max_iterations: 18
  timeout_secs: 300
  extra_args: ["--no-tui"]
expect:
  response_received: true
  exit_code_success_or_limit: true
  no_timeout: true
  output_contains:
    - "[supervisor] instances"
  events:
    - topic: migration.schema.review
      min_count: 1
    - topic: migration.backup.verify
      min_count: 1
    - topic: migration.smoke.run
      min_count: 1
    - topic: migration.rollback.audit
      min_count: 1
    - topic: schema.ready
      min_count: 1
    - topic: backup.ready
      min_count: 1
    - topic: smoke.ready
      min_count: 1
    - topic: rollback.ready
      min_count: 1
    - topic: migration.go_no_go.request
      min_count: 1
    - topic: migration.ready
      min_count: 1
  event_payload_contains:
    - topic: migration.ready
      contains: "decision: GO"
  event_absent_prefixes:
    - "gate."
  event_absent:
    - approval.requested
  no_jobs_after_loop_complete: true
  agents_snapshot:
    min_instances: 5
    hat_ids: [backup_verifier, migration_conductor, rollback_auditor, schema_reviewer, smoke_runner]
