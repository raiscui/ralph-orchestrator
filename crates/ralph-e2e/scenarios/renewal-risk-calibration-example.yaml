# renewal_risk_calibration 声明化(候选6)
id: parallel-renewal-risk-calibration-example
description: Directly runs examples/parallel-renewal-risk-calibration and asserts calibration lanes converge into renewal.calibration.ready (declarative) (declarative)
tier: "Tier 8: Parallel Runtime"
backends: [codex]
setup:
  example: parallel-renewal-risk-calibration
  max_iterations: 18
  timeout_secs: 300
  extra_args: ["--no-tui"]
expect:
  response_received: true
  exit_code_success_or_limit: true
  no_timeout: true
  output_contains:
    - "[supervisor] instances"
  events:
    - topic: renewal.usage.signal.review
      min_count: 1
    - topic: renewal.sponsor.coverage.review
      min_count: 1
    - topic: renewal.commercial.blocker.review
      min_count: 1
    - topic: renewal.success.plan.review
      min_count: 1
    - topic: usage.ready
      min_count: 1
    - topic: sponsor.ready
      min_count: 1
    - topic: blocker.ready
      min_count: 1
    - topic: success.ready
      min_count: 1
    - topic: renewal.calibration.packet.request
      min_count: 1
    - topic: renewal.calibration.ready
      min_count: 1
  event_payload_contains:
    - topic: renewal.calibration.ready
      contains: "calibration_status: READY_FOR_FORECAST_COMMIT"
    - topic: renewal.calibration.ready
      contains: "forecast_window: Q3_RENEWAL_CALIBRATION"
    - topic: renewal.calibration.ready
      contains: "forecast_owner: retention-ops"
  event_absent_prefixes:
    - "gate."
  event_absent:
    - approval.requested
  no_jobs_after_loop_complete: true
  agents_snapshot:
    min_instances: 5
    hat_ids: [commercial_blocker_reviewer, renewal_calibration_lead, sponsor_coverage_reviewer, success_plan_reviewer, usage_signal_reviewer]
