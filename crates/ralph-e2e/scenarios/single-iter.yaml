# single-iter 声明式试点
id: single-iter
description: Verifies a single iteration completes successfully (declarative)
tier: "Tier 2: Orchestration Loop"
backends: [claude, kiro, opencode, codex]
setup:
  config: |
    # Single iteration test config
    cli:
      backend: {backend}

    event_loop:
      max_iterations: 1
      completion_promise: "LOOP_COMPLETE"
  prompt: |
    You are testing Ralph orchestration.
    Complete this task in a single iteration:
    1. Create a simple task list in the scratchpad
    2. Mark the task as complete
    3. Output LOOP_COMPLETE to signal completion

    Write to the scratchpad first, then output LOOP_COMPLETE.
  max_iterations: 1
expect:
  response_received: true
  exit_code_success_or_limit: true
  no_timeout: true
  max_iterations: 1
  scratchpad_updated: true
  termination: LOOP_COMPLETE
