# multi_region_pipeline_sync 声明化(候选6)
id: parallel-multi-region-pipeline-sync-example
description: Directly runs examples/parallel-multi-region-pipeline-sync and asserts region lanes converge into pipeline.sync.ready (declarative)
tier: "Tier 8: Parallel Runtime"
backends: [codex]
setup:
  example: parallel-multi-region-pipeline-sync
  max_iterations: 18
  timeout_secs: 300
  extra_args: ["--no-tui"]
expect:
  response_received: true
  exit_code_success_or_limit: true
  no_timeout: true
  output_contains:
    - "[supervisor] instances"
  events:
    - topic: pipeline.amer.review
      min_count: 1
    - topic: pipeline.emea.review
      min_count: 1
    - topic: pipeline.apj.review
      min_count: 1
    - topic: pipeline.latam.review
      min_count: 1
    - topic: amer.ready
      min_count: 1
    - topic: emea.ready
      min_count: 1
    - topic: apj.ready
      min_count: 1
    - topic: latam.ready
      min_count: 1
    - topic: pipeline.sync.packet.request
      min_count: 1
    - topic: pipeline.sync.ready
      min_count: 1
  event_payload_contains:
    - topic: pipeline.sync.ready
      contains: "sync_status: READY_FOR_GLOBAL_FORECAST_CALL"
  event_absent_prefixes:
    - "gate."
  event_absent:
    - approval.requested
  no_jobs_after_loop_complete: true
  agents_snapshot:
    min_instances: 5
    hat_ids: [amer_pipeline_reviewer, apj_pipeline_reviewer, emea_pipeline_reviewer, global_pipeline_sync_lead, latam_pipeline_reviewer]
