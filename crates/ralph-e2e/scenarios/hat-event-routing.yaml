# hat-event-routing 声明化
#
#
# - 同 id `hat-event-routing`, description / tier 一致
# - 同 setup: ralph.yml 含 hats.tester(triggers=[test.run], publishes=[test.done])
#   + hats.deployer(triggers=[deploy.request], publishes=[deploy.done]) +
#   inline prompt(emit test.run + LOOP_COMPLETE) + max_iterations=3 +
#   backend.default_timeout()
# - supported_backends 默认 impl(全 backend); YAML 不显式 backends
# - expect 5 条断言映射:
#   response_received           → expect.response_received: true
#   exit_code_success_or_limit  → expect.exit_code_success_or_limit: true
#   no_timeout                  → expect.no_timeout: true
#   correct_hat_responded       → expect.output_contains_any + expect.events:
#     (stdout_lowercase "test"/      output_contains_any: [["Test", "test", "Tester", "tester"]]
#      "tester" || events            events:
#      starts_with "test.")           [{topic: test.run, min_count: 1},
#                                      {topic: test.done, min_count: 1}]
#     (OR 折 AND: 命令式是 OR(stdout || events); events 适配为精确 2 topic 列表,
#      与 2.2.1 build_event_emitted 同模式)
#   wrong_hat_not_triggered     → expect.event_absent_prefixes:
#     (NEGATED: stdout_uppercase      ["deploy."]
#      NOT contains "DEPLOYMENT
#      STATUS:" AND NOT events
#      starts_with "deploy.")
#     (NEGATED 断言适配: schema 有 event_absent_prefixes 检查 events 不含
#      deploy.* topic, 等价于 "events starts_with 'deploy.' 为 false"。
#      stdout_uppercase NOT contains "DEPLOYMENT STATUS:" 部分 schema 无
#      output_absent 字段, 直接 dropped — rationale: 实际 deployer hat 激活
#      会同时 emit deploy.* event, 该字段已经 catch 主要失败路径;
#      stdout-only 误激活是 hypothetical edge case, 不增加 schema 成本。)
id: hat-event-routing
description: Verifies hat event routing triggers correct hat (declarative)
tier: "Tier 5: Hat Collections"
setup:
  config: |
    # Event routing test config for {backend}
    cli:
      backend: {backend}

    event_loop:
      max_iterations: 3
      completion_promise: "LOOP_COMPLETE"

    hats:
      tester:
        name: "Tester"
        description: "Runs tests"
        triggers:
          - test.run
        publishes:
          - test.done
        instructions: |
          You are Tester. When you receive a test.run event:
          1. Acknowledge your Tester role
          2. Always include "TEST RUN STATUS:" in your output
          3. Emit using this exact XML format:

          <event topic="test.done">
          status: passed
          </event>

      deployer:
        name: "Deployer"
        description: "Handles deployment events"
        triggers:
          - deploy.request
        publishes:
          - deploy.done
        instructions: |
          You are Deployer. When you receive a deploy event, handle deployment.
          Always include "DEPLOYMENT STATUS:" in your output.
          When done, emit using this exact XML format:

          <event topic="deploy.done">
          status: deployed
          </event>
  prompt: |
    You are testing Ralph's event routing system.

    Emit a test.run event (should route to Tester hat):
    <event topic="test.run">
    Run unit tests for the math module
    </event>

    The Tester hat should handle this, NOT the Deployer.
    After tests complete, output LOOP_COMPLETE.
  max_iterations: 3
  # timeout_secs 不写 → runner 落回 backend.default_timeout()
expect:
  response_received: true
  exit_code_success_or_limit: true
  no_timeout: true
  # correct_hat_responded (OR 折 AND)
  output_contains_any:
    - ["Test", "test", "Tester", "tester"]
  events:
    - topic: test.run
      min_count: 1
    - topic: test.done
      min_count: 1
  # wrong_hat_not_triggered (NEGATED, dropped stdout 检查)
  event_absent_prefixes:
    - "deploy."
