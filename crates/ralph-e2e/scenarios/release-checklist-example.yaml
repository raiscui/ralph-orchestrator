# release-checklist-example 声明化(候选6)
id: parallel-release-checklist-example
description: Directly runs examples/parallel-release-checklist and asserts three readiness lanes converge into release.ready (declarative)
tier: "Tier 8: Parallel Runtime"
backends: [codex]
setup:
  example: parallel-release-checklist
  max_iterations: 16
  timeout_secs: 300
  extra_args: ["--no-tui"]
expect:
  response_received: true
  exit_code_success_or_limit: true
  no_timeout: true
  output_contains:
    - "[supervisor] instances"
  events:
    - topic: release.qa.check
      min_count: 1
    - topic: release.docs.check
      min_count: 1
    - topic: release.ops.check
      min_count: 1
    - topic: qa.ready
      min_count: 1
    - topic: docs.ready
      min_count: 1
    - topic: ops.ready
      min_count: 1
    - topic: release.summary.request
      min_count: 1
    - topic: release.ready
      min_count: 1
  event_payload_contains:
    - topic: release.ready
      contains: v2.4.0
  event_absent_prefixes:
    - "gate."
  no_jobs_after_loop_complete: true
  agents_snapshot:
    min_instances: 4
    hat_ids: [qa_checker, docs_checker, ops_checker, release_synthesizer]
