# hiring_debrief_panel 声明化(候选6)
id: parallel-hiring-debrief-panel-example
description: Directly runs examples/parallel-hiring-debrief-panel and asserts hiring lanes converge into hiring.packet.ready (declarative) (declarative)
tier: "Tier 8: Parallel Runtime"
backends: [codex]
setup:
  example: parallel-hiring-debrief-panel
  max_iterations: 18
  timeout_secs: 300
  extra_args: ["--no-tui"]
expect:
  response_received: true
  exit_code_success_or_limit: true
  no_timeout: true
  output_contains:
    - "[supervisor] instances"
  events:
    - topic: hiring.coding.debrief
      min_count: 1
    - topic: hiring.system.debrief
      min_count: 1
    - topic: hiring.collaboration.debrief
      min_count: 1
    - topic: hiring.reference.debrief
      min_count: 1
    - topic: coding.ready
      min_count: 1
    - topic: system.ready
      min_count: 1
    - topic: collaboration.ready
      min_count: 1
    - topic: reference.ready
      min_count: 1
    - topic: hiring.packet.request
      min_count: 1
    - topic: hiring.packet.ready
      min_count: 1
  event_payload_contains:
    - topic: hiring.packet.ready
      contains: "hiring_recommendation: STRONG_HIRE"
  event_absent_prefixes:
    - "gate."
  event_absent:
    - approval.requested
  no_jobs_after_loop_complete: true
  agents_snapshot:
    min_instances: 5
    hat_ids: [coding_interviewer, collaboration_interviewer, hiring_facilitator, reference_reviewer, system_design_interviewer]
