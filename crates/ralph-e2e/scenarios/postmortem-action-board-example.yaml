# postmortem_action_board 声明化(候选6)
id: parallel-postmortem-action-board-example
description: Directly runs examples/parallel-postmortem-action-board and asserts postmortem lanes converge into postmortem.board.ready (declarative)
tier: "Tier 8: Parallel Runtime"
backends: [codex]
setup:
  example: parallel-postmortem-action-board
  max_iterations: 18
  timeout_secs: 300
  extra_args: ["--no-tui"]
expect:
  response_received: true
  exit_code_success_or_limit: true
  no_timeout: true
  output_contains:
    - "[supervisor] instances"
  events:
    - topic: pm.timeline.build
      min_count: 1
    - topic: pm.root_cause.review
      min_count: 1
    - topic: pm.action.map
      min_count: 1
    - topic: pm.customer.recap
      min_count: 1
    - topic: timeline.ready
      min_count: 1
    - topic: root_cause.ready
      min_count: 1
    - topic: actions.ready
      min_count: 1
    - topic: customer.recap.ready
      min_count: 1
    - topic: pm.board.request
      min_count: 1
    - topic: postmortem.board.ready
      min_count: 1
  event_payload_contains:
    - topic: postmortem.board.ready
      contains: "status: READY_FOR_REVIEW"
  event_absent_prefixes:
    - "gate."
  event_absent:
    - approval.requested
  no_jobs_after_loop_complete: true
  agents_snapshot:
    min_instances: 5
    hat_ids: [action_owner_mapper, board_facilitator, customer_recap_writer, root_cause_editor, timeline_curator]
