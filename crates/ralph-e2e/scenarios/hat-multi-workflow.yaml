# hat-multi-workflow 声明化(候选 2.2.5: HatMultiWorkflowScenario → hat-multi-workflow.yaml)
#
# 与命令式 HatMultiWorkflowScenario 等价性分析:
# - 同 id `hat-multi-workflow`, description / tier 一致
# - 同 setup: ralph.yml 含 hats.planner(triggers=[plan.request], publishes=[build.task])
#   + hats.builder(triggers=[build.task], publishes=[build.done]) + inline prompt
#   (emit plan.request + LOOP_COMPLETE) + max_iterations=6 + backend.default_timeout()
# - supported_backends 默认 impl(全 backend); YAML 不显式 backends
# - expect 5 条断言映射:
#   response_received           → expect.response_received: true
#   exit_code_success_or_limit  → expect.exit_code_success_or_limit: true
#   no_timeout                  → expect.no_timeout: true
#   workflow_progressed         → expect.events:
#     (OR: has_build_task ||         [{topic: plan.request, min_count: 1},
#      (has_plan && has_build_done))  {topic: build.task, min_count: 1},
#                                      {topic: build.done, min_count: 1}]
#     (OR 折 AND: 命令式 OR 是 defensive 路径; scenario 已知 emit
#      plan.request → build.task → build.done 完整链; 用 3 条精确 topic
#      match 要求全部出现, AND 语义更严格, 正确捕获工作流断点;
#      与 2.2.1 build_event_emitted 同模式)
#   both_hats_contributed       → expect.output_contains_any:
#     (OR: has_planner ||            [["Planner", "planner", "Plan", "plan",
#      has_builder)                    "Builder", "builder", "Implement",
#                                       "implement"]]
#     (8 个 case 变体覆盖 4 关键词, 任一命中即通过 — 与 2.2.1 hat_persona_visible
#      同模式; 命令式 OR 含 "plan" 同时也匹配 "planner", 我们的 8 变体同时
#      覆盖, 单字段断言等价)
id: hat-multi-workflow
description: Verifies Planner → Builder delegation workflow (declarative)
tier: "Tier 5: Hat Collections"
setup:
  config: |
    # Multi-hat workflow test config for {backend}
    cli:
      backend: {backend}

    event_loop:
      max_iterations: 6
      completion_promise: "LOOP_COMPLETE"

    hats:
      planner:
        name: "Planner"
        description: "Plans tasks and delegates to Builder"
        triggers:
          - plan.request
        publishes:
          - build.task
        instructions: |
          You are Planner. When you receive a plan.request:
          1. Break down the request into a build task
          2. Emit a build.task event to delegate to Builder using this exact XML format:

          <event topic="build.task">
          Task: [describe the task]
          </event>

          Always mention "Planner analyzing" in your response.

      builder:
        name: "Builder"
        description: "Implements tasks from Planner"
        triggers:
          - build.task
        publishes:
          - build.done
        instructions: |
          You are Builder. When you receive a build.task:
          1. Implement the requested task
          2. Emit a build.done event when complete using this exact XML format:

          <event topic="build.done">
          result: complete
          </event>

          Always mention "Builder implementing" in your response.
  prompt: |
    You are testing Ralph's multi-hat workflow. Your FIRST action must be to emit this event EXACTLY as shown:

    <event topic="plan.request">
    Request: Create a utility function for string formatting
    </event>

    This will trigger the Planner hat. After emitting the event above, the workflow will be:
    1. Your plan.request triggers Planner
    2. Planner emits build.task which triggers Builder
    3. Builder emits build.done when complete
    4. You output LOOP_COMPLETE

    IMPORTANT: You MUST output the XML event tags exactly as shown above in your response. Do not just describe it - actually output the <event> tags.
  max_iterations: 6
  # timeout_secs 不写 → runner 落回 backend.default_timeout()
expect:
  response_received: true
  exit_code_success_or_limit: true
  no_timeout: true
  # workflow_progressed (OR 折 AND): 3 个 topic 全出现
  events:
    - topic: plan.request
      min_count: 1
    - topic: build.task
      min_count: 1
    - topic: build.done
      min_count: 1
  # both_hats_contributed (OR): 8 case 变体覆盖 4 关键词
  output_contains_any:
    - ["Planner", "planner", "Plan", "plan", "Builder", "builder", "Implement", "implement"]
