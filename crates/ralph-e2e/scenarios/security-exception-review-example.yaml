# security_exception_review 声明化(候选6)
id: parallel-security-exception-review-example
description: Directly runs examples/parallel-security-exception-review and asserts exception lanes converge into exception.ready (declarative) (declarative)
tier: "Tier 8: Parallel Runtime"
backends: [codex]
setup:
  example: parallel-security-exception-review
  max_iterations: 18
  timeout_secs: 300
  extra_args: ["--no-tui"]
expect:
  response_received: true
  exit_code_success_or_limit: true
  no_timeout: true
  output_contains:
    - "[supervisor] instances"
  events:
    - topic: exception.threat.review
      min_count: 1
    - topic: exception.controls.review
      min_count: 1
    - topic: exception.data.scope.review
      min_count: 1
    - topic: exception.expiry.review
      min_count: 1
    - topic: threat.reviewed
      min_count: 1
    - topic: controls.reviewed
      min_count: 1
    - topic: data.scope.ready
      min_count: 1
    - topic: expiry.ready
      min_count: 1
    - topic: exception.decision.request
      min_count: 1
    - topic: exception.ready
      min_count: 1
  event_payload_contains:
    - topic: exception.ready
      contains: "decision: APPROVE_WITH_COMPENSATING_CONTROLS"
  event_absent_prefixes:
    - "gate."
  event_absent:
    - approval.requested
  no_jobs_after_loop_complete: true
  agents_snapshot:
    min_instances: 5
    hat_ids: [compensating_controls_reviewer, data_scope_reviewer, exception_decider, expiry_policy_reviewer, threat_model_reviewer]
