# customer_onboarding_activation 声明化(候选6)
id: parallel-customer-onboarding-activation-example
description: Directly runs examples/parallel-customer-onboarding-activation and asserts onboarding lanes converge into onboarding.activation.ready (declarative) (declarative)
tier: "Tier 8: Parallel Runtime"
backends: [codex]
setup:
  example: parallel-customer-onboarding-activation
  max_iterations: 18
  timeout_secs: 300
  extra_args: ["--no-tui"]
expect:
  response_received: true
  exit_code_success_or_limit: true
  no_timeout: true
  output_contains:
    - "[supervisor] instances"
  events:
    - topic: onboarding.integration.review
      min_count: 1
    - topic: onboarding.security.handoff
      min_count: 1
    - topic: onboarding.enablement.plan
      min_count: 1
    - topic: onboarding.success.plan.review
      min_count: 1
    - topic: integration.ready
      min_count: 1
    - topic: security.handoff.ready
      min_count: 1
    - topic: enablement.ready
      min_count: 1
    - topic: success.plan.ready
      min_count: 1
    - topic: onboarding.activation.request
      min_count: 1
    - topic: onboarding.activation.ready
      min_count: 1
  event_payload_contains:
    - topic: onboarding.activation.ready
      contains: "onboarding_status: READY_FOR_KICKOFF"
  event_absent_prefixes:
    - "gate."
  event_absent:
    - approval.requested
  no_jobs_after_loop_complete: true
  agents_snapshot:
    min_instances: 5
    hat_ids: [activation_manager, enablement_coordinator, integration_lead, security_handoff_owner, success_plan_owner]
