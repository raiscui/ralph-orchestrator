# launch_readiness_command 声明化(候选6)
id: parallel-launch-readiness-command-example
description: Directly runs examples/parallel-launch-readiness-command and asserts launch lanes converge into launch.command.ready (declarative) (declarative)
tier: "Tier 8: Parallel Runtime"
backends: [codex]
setup:
  example: parallel-launch-readiness-command
  max_iterations: 18
  timeout_secs: 300
  extra_args: ["--no-tui"]
expect:
  response_received: true
  exit_code_success_or_limit: true
  no_timeout: true
  output_contains:
    - "[supervisor] instances"
  events:
    - topic: launch.qa.readiness
      min_count: 1
    - topic: launch.observability.review
      min_count: 1
    - topic: launch.rollback.review
      min_count: 1
    - topic: launch.comms.review
      min_count: 1
    - topic: launch.qa.ready
      min_count: 1
    - topic: launch.observability.ready
      min_count: 1
    - topic: launch.rollback.ready
      min_count: 1
    - topic: launch.comms.ready
      min_count: 1
    - topic: launch.command.request
      min_count: 1
    - topic: launch.command.ready
      min_count: 1
  event_payload_contains:
    - topic: launch.command.ready
      contains: "decision: GO"
  event_absent_prefixes:
    - "gate."
  event_absent:
    - approval.requested
  no_jobs_after_loop_complete: true
  agents_snapshot:
    min_instances: 5
    hat_ids: [comms_coordinator, launch_commander, observability_guard, qa_readiness_lead, rollback_commander]
