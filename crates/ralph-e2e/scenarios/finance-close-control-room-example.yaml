# finance_close_control_room 声明化(候选6)
id: parallel-finance-close-control-room-example
description: Directly runs examples/parallel-finance-close-control-room and asserts close lanes converge into close.packet.ready (declarative) (declarative)
tier: "Tier 8: Parallel Runtime"
backends: [codex]
setup:
  example: parallel-finance-close-control-room
  max_iterations: 18
  timeout_secs: 300
  extra_args: ["--no-tui"]
expect:
  response_received: true
  exit_code_success_or_limit: true
  no_timeout: true
  output_contains:
    - "[supervisor] instances"
  events:
    - topic: close.revenue.reconcile
      min_count: 1
    - topic: close.expense.accrual.review
      min_count: 1
    - topic: close.cash.position.check
      min_count: 1
    - topic: close.anomaly.watch.review
      min_count: 1
    - topic: revenue.ready
      min_count: 1
    - topic: expense.ready
      min_count: 1
    - topic: cash.ready
      min_count: 1
    - topic: anomaly.ready
      min_count: 1
    - topic: close.packet.request
      min_count: 1
    - topic: close.packet.ready
      min_count: 1
  event_payload_contains:
    - topic: close.packet.ready
      contains: "close_status: READY_TO_CLOSE"
  event_absent_prefixes:
    - "gate."
  event_absent:
    - approval.requested
  no_jobs_after_loop_complete: true
  agents_snapshot:
    min_instances: 5
    hat_ids: [anomaly_watch_reviewer, cash_controller, close_conductor, expense_accrual_reviewer, revenue_reconciler]
