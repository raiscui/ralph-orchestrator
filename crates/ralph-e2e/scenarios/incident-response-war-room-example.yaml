# incident_response_war_room 声明化(候选6)
id: parallel-incident-response-war-room-example
description: Directly runs examples/parallel-incident-response-war-room and asserts incident lanes converge into incident.command.ready (declarative) (declarative)
tier: "Tier 8: Parallel Runtime"
backends: [codex]
setup:
  example: parallel-incident-response-war-room
  max_iterations: 18
  timeout_secs: 300
  extra_args: ["--no-tui"]
expect:
  response_received: true
  exit_code_success_or_limit: true
  no_timeout: true
  output_contains:
    - "[supervisor] instances"
  events:
    - topic: incident.triage
      min_count: 1
    - topic: incident.logs.analyze
      min_count: 1
    - topic: incident.rollback.plan
      min_count: 1
    - topic: incident.status.prepare
      min_count: 1
    - topic: triage.done
      min_count: 1
    - topic: logs.done
      min_count: 1
    - topic: rollback.done
      min_count: 1
    - topic: status.draft.done
      min_count: 1
    - topic: incident.command.request
      min_count: 1
    - topic: incident.command.ready
      min_count: 1
  event_payload_contains:
    - topic: incident.command.ready
      contains: EXECUTE_ROLLBACK
  event_absent_prefixes:
    - "gate."
  event_absent:
    - approval.requested
  no_jobs_after_loop_complete: true
  agents_snapshot:
    min_instances: 5
    hat_ids: [incident_commander, incident_triager, log_analyst, rollback_planner, status_writer]
