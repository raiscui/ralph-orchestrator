# customer_renewal_desk 声明化(候选6)
id: parallel-customer-renewal-desk-example
description: Directly runs examples/parallel-customer-renewal-desk and asserts renewal lanes converge into renewal.plan.ready (declarative) (declarative)
tier: "Tier 8: Parallel Runtime"
backends: [codex]
setup:
  example: parallel-customer-renewal-desk
  max_iterations: 18
  timeout_secs: 300
  extra_args: ["--no-tui"]
expect:
  response_received: true
  exit_code_success_or_limit: true
  no_timeout: true
  output_contains:
    - "[supervisor] instances"
  events:
    - topic: renewal.adoption.review
      min_count: 1
    - topic: renewal.support.health
      min_count: 1
    - topic: renewal.commercial.review
      min_count: 1
    - topic: renewal.sponsor.map
      min_count: 1
    - topic: adoption.ready
      min_count: 1
    - topic: support.ready
      min_count: 1
    - topic: commercial.ready
      min_count: 1
    - topic: sponsor.ready
      min_count: 1
    - topic: renewal.plan.request
      min_count: 1
    - topic: renewal.plan.ready
      min_count: 1
  event_payload_contains:
    - topic: renewal.plan.ready
      contains: "renewal_decision: SAVE_AND_RENEW"
  event_absent_prefixes:
    - "gate."
  event_absent:
    - approval.requested
  no_jobs_after_loop_complete: true
  agents_snapshot:
    min_instances: 5
    hat_ids: [adoption_reviewer, commercial_owner, renewal_strategist, sponsor_mapper, support_health_reviewer]
