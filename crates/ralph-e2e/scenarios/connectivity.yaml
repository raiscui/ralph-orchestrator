# connectivity 声明化(与命令式 ConnectivityScenario 等价)
id: connectivity
description: Verifies backend connectivity via PONG round-trip (declarative)
tier: "Tier 1: Connectivity"
setup:
  config: |
    # Connectivity test config
    cli:
      backend: {backend}

    event_loop:
      max_iterations: 1
      completion_promise: "PONG"
  prompt: |
    You are testing connectivity. Your ONLY task is to respond with the exact word "PONG" (nothing else).
  max_iterations: 1
expect:
  response_received: true
  exit_code_success_or_limit: true
  no_timeout: true
  max_iterations: 1
  output_contains: ["PONG"]
