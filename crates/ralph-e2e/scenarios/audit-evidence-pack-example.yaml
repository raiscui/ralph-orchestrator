# audit_evidence_pack 声明化(候选6)
id: parallel-audit-evidence-pack-example
description: Directly runs examples/parallel-audit-evidence-pack and asserts audit lanes converge into audit.packet.ready (declarative) (declarative)
tier: "Tier 8: Parallel Runtime"
backends: [codex]
setup:
  example: parallel-audit-evidence-pack
  max_iterations: 18
  timeout_secs: 300
  extra_args: ["--no-tui"]
expect:
  response_received: true
  exit_code_success_or_limit: true
  no_timeout: true
  output_contains:
    - "[supervisor] instances"
  events:
    - topic: audit.access.export
      min_count: 1
    - topic: audit.change.log.collect
      min_count: 1
    - topic: audit.backup.verify
      min_count: 1
    - topic: audit.incident.history.collect
      min_count: 1
    - topic: access.evidence.ready
      min_count: 1
    - topic: change.evidence.ready
      min_count: 1
    - topic: backup.evidence.ready
      min_count: 1
    - topic: incident.evidence.ready
      min_count: 1
    - topic: audit.packet.request
      min_count: 1
    - topic: audit.packet.ready
      min_count: 1
  event_payload_contains:
    - topic: audit.packet.ready
      contains: "audit_status: READY_FOR_AUDITOR"
    - topic: audit.packet.ready
      contains: "control_set: soc2_cc7_cc8"
    - topic: audit.packet.ready
      contains: "owner: compliance-ops"
  event_absent_prefixes:
    - "gate."
  event_absent:
    - approval.requested
  no_jobs_after_loop_complete: true
  agents_snapshot:
    min_instances: 5
    hat_ids: [access_exporter, audit_packet_editor, backup_verifier, change_log_collector, incident_history_curator]
