# regional_operating_review 声明化(候选6)
id: parallel-regional-operating-review-example
description: Directly runs examples/parallel-regional-operating-review and asserts regional lanes converge into regional.review.ready (declarative) (declarative)
tier: "Tier 8: Parallel Runtime"
backends: [codex]
setup:
  example: parallel-regional-operating-review
  max_iterations: 18
  timeout_secs: 300
  extra_args: ["--no-tui"]
expect:
  response_received: true
  exit_code_success_or_limit: true
  no_timeout: true
  output_contains:
    - "[supervisor] instances"
  events:
    - topic: regional.pipeline.health.review
      min_count: 1
    - topic: regional.delivery.capacity.review
      min_count: 1
    - topic: regional.support.signal.review
      min_count: 1
    - topic: regional.talent.plan.review
      min_count: 1
    - topic: pipeline.ready
      min_count: 1
    - topic: delivery.ready
      min_count: 1
    - topic: support.ready
      min_count: 1
    - topic: talent.ready
      min_count: 1
    - topic: regional.operating.packet.request
      min_count: 1
    - topic: regional.review.ready
      min_count: 1
  event_payload_contains:
    - topic: regional.review.ready
      contains: "review_status: READY_FOR_REGION_WEEKLY"
    - topic: regional.review.ready
      contains: "region_code: APAC_ENTERPRISE"
    - topic: regional.review.ready
      contains: "operating_owner: regional-chief-of-staff"
  event_absent_prefixes:
    - "gate."
  event_absent:
    - approval.requested
  no_jobs_after_loop_complete: true
  agents_snapshot:
    min_instances: 5
    hat_ids: [delivery_capacity_reviewer, pipeline_health_reviewer, regional_operating_lead, support_signal_reviewer, talent_plan_reviewer]
