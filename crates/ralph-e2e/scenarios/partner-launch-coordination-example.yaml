# partner_launch_coordination 声明化(候选6)
id: parallel-partner-launch-coordination-example
description: Directly runs examples/parallel-partner-launch-coordination and asserts partner lanes converge into partner.launch.ready (declarative)
tier: "Tier 8: Parallel Runtime"
backends: [codex]
setup:
  example: parallel-partner-launch-coordination
  max_iterations: 18
  timeout_secs: 300
  extra_args: ["--no-tui"]
expect:
  response_received: true
  exit_code_success_or_limit: true
  no_timeout: true
  output_contains:
    - "[supervisor] instances"
  events:
    - topic: partner.solution.enablement.review
      min_count: 1
    - topic: partner.legal.terms.review
      min_count: 1
    - topic: partner.channel.marketing.review
      min_count: 1
    - topic: partner.sales.handoff.review
      min_count: 1
    - topic: solution.ready
      min_count: 1
    - topic: legal.ready
      min_count: 1
    - topic: marketing.ready
      min_count: 1
    - topic: sales.ready
      min_count: 1
    - topic: partner.launch.packet.request
      min_count: 1
    - topic: partner.launch.ready
      min_count: 1
  event_payload_contains:
    - topic: partner.launch.ready
      contains: "partner_launch_status: READY_TO_ANNOUNCE"
  event_absent_prefixes:
    - "gate."
  event_absent:
    - approval.requested
  no_jobs_after_loop_complete: true
  agents_snapshot:
    min_instances: 5
    hat_ids: [channel_marketing_manager, legal_terms_owner, partner_launch_manager, sales_handoff_manager, solution_enablement_lead]
