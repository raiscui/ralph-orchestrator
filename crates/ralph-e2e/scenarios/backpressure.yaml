# backpressure 声明化 (Tier 3, declarative YAML)
id: backpressure
description: Verifies backpressure evidence in build.done (declarative)
tier: "Tier 3: Events"
backends: [claude, kiro, opencode, codex]
setup:
  config: |
    # Backpressure test config
    cli:
      backend: {backend}

    event_loop:
      max_iterations: 2
      completion_promise: "LOOP_COMPLETE"
  prompt: |
    You are testing Ralph's backpressure mechanism.

    Backpressure is Ralph's quality gate system. You must emit a build.done event.

    IMPORTANT: You MUST include this EXACT XML in your response text:

    <event topic="build.done">
    tests: pass
    lint: pass
    </event>

    After emitting the event above, output LOOP_COMPLETE on its own line.

    Now emit the event:
  max_iterations: 2
expect:
  response_received: true
  exit_code_success_or_limit: true
  no_timeout: true
  events:
    - topic: build.done
      min_count: 1
  event_payload_keywords:
    - topic: build.done
      keywords: ["pass", "tests", "lint"]
