# vendor_security_procurement 声明化(候选6)
id: parallel-vendor-security-procurement-example
description: Directly runs examples/parallel-vendor-security-procurement and asserts vendor lanes converge into vendor.ready (declarative)
tier: "Tier 8: Parallel Runtime"
backends: [codex]
setup:
  example: parallel-vendor-security-procurement
  max_iterations: 18
  timeout_secs: 300
  extra_args: ["--no-tui"]
expect:
  response_received: true
  exit_code_success_or_limit: true
  no_timeout: true
  output_contains:
    - "[supervisor] instances"
  events:
    - topic: vendor.security.assess
      min_count: 1
    - topic: vendor.privacy.review
      min_count: 1
    - topic: vendor.procurement.check
      min_count: 1
    - topic: vendor.legal.review
      min_count: 1
    - topic: security.assessed
      min_count: 1
    - topic: privacy.ready
      min_count: 1
    - topic: procurement.ready
      min_count: 1
    - topic: legal.ready
      min_count: 1
    - topic: vendor.decision.request
      min_count: 1
    - topic: vendor.ready
      min_count: 1
  event_payload_contains:
    - topic: vendor.ready
      contains: "decision: APPROVE_PILOT"
  event_absent_prefixes:
    - "gate."
  event_absent:
    - approval.requested
  no_jobs_after_loop_complete: true
  agents_snapshot:
    min_instances: 5
    hat_ids: [legal_counsel, privacy_reviewer, procurement_owner, security_assessor, vendor_decider]
