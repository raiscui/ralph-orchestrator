# Ralph Orchestrator documentation site.
#
# The site is built as a static artifact and published through GitHub Pages.
# Keep this file boring: MkDocs Material is already the repo-supported stack.

site_name: Ralph Orchestrator
site_description: Static documentation for the Ralph Wiggum orchestration technique, Ralph hats, events, memories, tasks, and verification backpressure.
site_author: Ralph Orchestrator Contributors
site_url: https://mikeyobrien.github.io/ralph-orchestrator/
repo_url: https://github.com/mikeyobrien/ralph-orchestrator
repo_name: mikeyobrien/ralph-orchestrator
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.select
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Start:
    - start/index.md
  - Method:
    - method/ralph-wiggum.md
  - System:
    - system/architecture.md
    - system/events-and-hats.md
  - Runbook:
    - runbook/configuration.md
    - runbook/startup-resource-bootstrap.md
    - runbook/runtime-capabilities.md
    - runbook/testing-and-evidence.md
  - Publish:
    - publish/github-pages.md
  - Sources:
    - sources/index.md

# The repository still contains an older, broader docs tree. This build uses a
# fresh information architecture while keeping those files intact so unrelated
# local edits are not lost.
exclude_docs: |
  03-best-practices/**
  06-analysis/**
  advanced/**
  api/**
  concepts/**
  contributing/**
  deployment/**
  examples/**
  getting-started/**
  guide/**
  migration/**
  plans/**
  reference/**
  contributing.md
  installation.md
  license.md
  mock-cli.md
  quick-start.md
  research.md

plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - styles/ralph.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mikeyobrien/ralph-orchestrator
  generator: false

copyright: Copyright &copy; 2024-2026 Ralph Orchestrator Contributors
