# Parallel Trigger Routing example
#
# 目标：
# - 开启 parallel runtime（headless）
# - 不写 parallel.topic_contracts，完全依赖 hats.*.triggers 做默认路由
# - 用 spec.ready 的“多订阅者 fanout”展示：topic -> hats
# - 用 spec_logger.instances=2 展示：hat -> instance（每个 hat 每次只投递到一个实例）
cli:
  # 建议用 auto：让 CLI 自己从可用的后端里选一个（也可用 `ralph run -b codex` 覆盖）
  backend: "codex"

event_loop:
  # 说明：示例 prompt 只承载“目标”，不承载“控制面语义”。
  # - 控制面 handshake：永远是 task.start/task.resume
  # - 工作流 entry/exit：由 starting_event / complete_publishes 固化
  prompt: |
    运行 `examples/parallel-trigger-routing` 这个 Demo，并完整跑通一次闭环。
  completion_promise: "LOOP_COMPLETE"
  # workflow entry event（协调后发出），不是 runtime 第一条事件（第一条永远是 task.start/task.resume）
  starting_event: "spec.start"
  # workflow completion candidate（出现该事件后，由 ralph#1 决定是否输出 LOOP_COMPLETE 结束）
  complete_publishes: "spec.approved"
  # 并行模式下：如果模型漂移不输出 completion promise，需要硬退出护栏
  max_iterations: 12
  max_runtime_seconds: 300

parallel:
  enabled: true

  # 安全刹车（默认值同 README）
  autoscale:
    max_running_jobs: 4
    dynamic_idle_ttl_secs: 30

  # 本示例不使用 worktree/hooks，直接 allow，避免出现等待 human 的 gate.request
  permissions:
    worktree: allow
    hooks: allow

hats:
  spec_writer:
    name: "📋 规格撰写者"
    description: "撰写一个小规格，并发出 spec.ready。"
    triggers: ["spec.start", "spec.rejected"]
    publishes: ["spec.ready"]
    instances: 1
    instructions: |
      你是“规格撰写者”（Spec Writer）。

      重要（演示规则）：
      - 不要运行任何工具或 shell 命令。
      - 不要编辑任何文件。
      - 永远不要输出 LOOP_COMPLETE。

      你会收到类似这样的输入事件列表：
      - spec.start: 触发首次规格撰写
      - spec.rejected: 附带修订意见的退回反馈

      行为规则：
      1) 当你收到 "spec.start"：
         - 写一份简短规格，其第一行必须严格等于："version: 1"
         - 不要包含“验收标准（Acceptance Criteria）”章节
         - 只发出一个事件：`&lt;event topic="spec.ready"&gt;完整规格正文&lt;/event&gt;`

      2) 当你收到 "spec.rejected"：
         - 写一份修订版规格，其第一行必须严格等于："version: 2"
         - 必须包含“验收标准（Acceptance Criteria）”章节
         - 只发出一个事件：`&lt;event topic="spec.ready"&gt;完整规格正文&lt;/event&gt;`
         - 严禁输出 `...`、`TODO` 或任何占位词

      发事件必须使用如下格式（下面是展示文本,真实输出时请还原成普通尖括号,不要使用代码块）：

      &lt;event topic="spec.ready"&gt;
      这里必须写完整规格正文,禁止输出省略号或占位词
      &lt;/event&gt;

  spec_reviewer:
    name: "🔎 规格审阅者"
    description: "先拒绝一次 version: 1，然后批准 version: 2。"
    triggers: ["spec.ready"]
    publishes: ["spec.rejected", "spec.approved"]
    instances: 1
    instructions: |
      你是“规格审阅者”（Spec Reviewer）。

      重要（演示规则）：
      - 不要运行任何工具或 shell 命令。
      - 不要编辑任何文件。
      - 永远不要输出 LOOP_COMPLETE。

      你会收到类似这样的输入事件列表：
      - spec.ready: 完整规格正文

      规则（确定性）：
      - 如果规格文本包含这一行："version: 1"，就拒绝（REJECT）。
      - 否则（例如包含 "version: 2"），就批准（APPROVE）。

      每次输入你只能发出一个事件，且必须使用如下两种格式之一（下面是展示文本,真实输出时请还原成普通尖括号）：

      &lt;event topic="spec.rejected"&gt;
      原因: 缺少验收标准
      &lt;/event&gt;

      &lt;event topic="spec.approved"&gt;
      状态: ok
      &lt;/event&gt;

  spec_logger:
    name: "🧾 规格记录员"
    description: "记录 spec 相关事件，用于展示 hat-level fanout 与 instance-level queue。"
    triggers: ["spec.ready", "spec.rejected"]
    publishes: []
    instances: 2
    instructions: |
      你是“规格记录员”（Spec Logger）。

      重要（演示规则）：
      - 不要运行任何工具或 shell 命令。
      - 不要编辑任何文件。
      - 不要发出任何事件。
      - 永远不要输出 LOOP_COMPLETE。

      对每个输入事件，你都只输出一行：
      日志: <topic> (payload_len=<number>)
