# Parallel Finance Close Control Room example
#
# 目标:
# - 演示财务结账前的多控制面并行推进
# - 演示 revenue / expense / cash / anomaly 收齐后再给 close 结论

cli:
  backend: "codex"

event_loop:
  prompt_file: "PROMPT.md"
  ralph_prompt: |
    # Parallel Finance Close Control Room

    你是并行模式下的 `ralph#1`(coordinator)。

    你的输入来自 `PROMPT.md` 的 `CLOSE_PACKET`。
    其中至少包含:
    - `## Revenue Packet`
    - `## Expense Packet`
    - `## Cash Packet`
    - `## Anomaly Packet`

    重要规则:
    - 你必须先并行派发 4 条 finance close 任务。
    - 只有 4 条 ready 事件全部到齐后,才允许发布 `close.packet.request`。
    - `close.packet.ready` 出现前,禁止输出 `LOOP_COMPLETE`。
    - 在 `close.packet.ready` 出现前,禁止输出任何普通文本、分析文本或解释文本。
    - `LOOP_COMPLETE` 这个字符串只能在最终收尾那一行出现一次。在那之前,连提及都不允许。
    - 如果某个 lane 只输出了 `&lt;event ...&gt;` 这类转义展示文本,不要把它当成 ready 事件。

    当你收到 `task.start` 时:
    1) 在同一条输出里连续发布:
       - `close.revenue.reconcile`
       - `close.expense.accrual.review`
       - `close.cash.position.check`
       - `close.anomaly.watch.review`
    2) 每条任务都必须携带:
       - close_id
       - lane
       - review_packet

    当你观察到:
    - `revenue.ready`
    - `expense.ready`
    - `cash.ready`
    - `anomaly.ready`
    全部出现后:
    - 你必须只发布一次 `close.packet.request`
    - 后续重复或迟到的 `*.ready` 必须忽略

    当 4 条 ready 还没有全部到齐时:
    - 你必须保持静默,空输出是合法且首选的
    - 不要输出任何等待说明、分析文本、topic 名称或 completion promise
    - 不要重复发布已发过的 fanout 任务

    当你收到 `close.packet.ready` 时:
    1) 输出 close summary
       - 至少包含 close_id、close_status、materiality、owner
    2) 最后一行单独输出 `LOOP_COMPLETE`
    3) 输出 `LOOP_COMPLETE` 之后,不要再发布任何新事件

    发事件时请使用真实尖括号。
    下面只是展示文本:

    &lt;event topic="close.revenue.reconcile"&gt;
    close_id: ...
    lane: revenue
    review_packet: |
      ...
    &lt;/event&gt;
  completion_promise: "LOOP_COMPLETE"
  complete_publishes: "close.packet.ready"
  max_iterations: 18
  max_runtime_seconds: 300

parallel:
  enabled: true
  autoscale:
    max_running_jobs: 6
    dynamic_idle_ttl_secs: 30
  permissions:
    worktree: allow
    hooks: allow

hats:
  revenue_reconciler:
    name: "Revenue Reconciler"
    description: "确认收入对账是否收敛。"
    triggers: ["close.revenue.reconcile"]
    publishes: ["revenue.ready"]
    instances: 1
    instructions: |
      你是 `revenue_reconciler`。

      重要:
      - 不要运行任何工具或 shell 命令。
      - 不要编辑任何文件。
      - 不要输出 `LOOP_COMPLETE`。
      - 你的最终回复必须直接从 `revenue.ready` 的真实 event 开始标签开始。
      - 不要使用自闭合 `&lt;event .../&gt;` 形式。
      - 必须写出开始标签、payload 正文、结束标签这 3 部分,不要把业务字段塞进 opening tag 属性。
      - 禁止输出 `&lt;event`、`&gt;`、代码块、前言、后续建议或任何事件外 prose。
      - 输出完真实 event 结束标签后立刻停止,不要再补充任何文字。

      输出 payload 最低要求:
      - lane: revenue
      - status: ready
      - revenue_status
      - summary
      - `summary` 保持 1 句短句,不要写分析过程。

