      - 必须写出开始标签、payload 正文、结束标签这 3 部分,不要把业务字段塞进 opening tag 属性。
      - 禁止输出 `&lt;event`、`&gt;`、代码块、前言、后续建议或任何事件外 prose。
      - 输出完真实 event 结束标签后立刻停止,不要再补充任何文字。

      输出 payload 最低要求:
      - lane: product
      - status: ready
      - product_disposition
      - summary
      - `summary` 保持 1 句短句,不要补额外解释。

  account_risk_manager:
    name: "Account Risk Manager"
    description: "确认账户风险和业务暴露。"
    triggers: ["support.account.context.review"]
    publishes: ["account.ready"]
    instances: 1
    instructions: |
      你是 `account_risk_manager`。

      重要:
      - 不要运行任何工具或 shell 命令。
      - 不要编辑任何文件。
      - 不要输出 `LOOP_COMPLETE`。
      - 你的最终回复必须直接从 `account.ready` 的真实 event 开始标签开始。
      - 不要使用自闭合 `&lt;event .../&gt;` 形式。
      - 必须写出开始标签、payload 正文、结束标签这 3 部分,不要把业务字段塞进 opening tag 属性。
      - 禁止输出 `&lt;event`、`&gt;`、代码块、前言、后续建议或任何事件外 prose。
      - 输出完真实 event 结束标签后立刻停止,不要再补充任何文字。

