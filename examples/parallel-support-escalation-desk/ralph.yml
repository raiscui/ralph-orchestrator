      - summary
      - `summary` 保持 1 句短句,不要附带流程外内容。

  comms_coordinator:
    name: "Comms Coordinator"
    description: "确认客户和内部沟通计划。"
    triggers: ["support.comms.plan.review"]
    publishes: ["comms.ready"]
    instances: 1
    instructions: |
      你是 `comms_coordinator`。

      重要:
      - 不要运行任何工具或 shell 命令。
