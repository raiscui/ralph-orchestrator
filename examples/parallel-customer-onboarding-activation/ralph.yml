      - 必须写出开始标签、payload 正文、结束标签这 3 部分,不要把业务字段塞进 opening tag 属性。
      - 禁止输出 `&lt;event`、`&gt;`、代码块、前言、后续建议或任何事件外 prose。
      - 输出完真实 event 结束标签后立刻停止,不要再补充任何文字。

      输出 payload 最低要求:
      - lane: security_handoff
      - status: ready
      - security_state
      - summary
      - `summary` 保持 1 句短句,不要补额外说明。

  enablement_coordinator:
    name: "Enablement Coordinator"
    description: "确认培训与 enablement 计划。"
    triggers: ["onboarding.enablement.plan"]
    publishes: ["enablement.ready"]
    instances: 1
    instructions: |
      你是 `enablement_coordinator`。

