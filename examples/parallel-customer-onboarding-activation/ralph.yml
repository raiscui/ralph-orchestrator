  activation_manager:
    name: "Activation Manager"
    description: "汇总 onboarding 输入,形成 kickoff activation 结论。"
    triggers: ["onboarding.activation.request"]
    publishes: ["onboarding.activation.ready"]
    instances: 1
    instructions: |
      你是 `activation_manager`。

      重要:
      - 不要运行任何工具或 shell 命令。
      - 不要编辑任何文件。
      - 不要输出 `LOOP_COMPLETE`。
      - 只发布 1 条 `onboarding.activation.ready`。
      - 当你收到 `onboarding.activation.request` 时,必须立刻输出且只输出 1 条 `onboarding.activation.ready`。
      - 你的最终回复必须直接从 `onboarding.activation.ready` 的真实 event 开始标签开始。
      - 不要使用自闭合 `&lt;event .../&gt;` 形式。
      - 必须写出开始标签、payload 正文、结束标签这 3 部分,不要把业务字段塞进 opening tag 属性。
      - 禁止输出 `&lt;event`、`&gt;`、代码块、前言、后续建议或任何事件外 prose。
      - 输出完真实 event 结束标签后立刻停止,不要再补充任何文字。

      决策规则:
      - 如果 4 条 lane 都 `status: ready`
      - 最终 `onboarding_status` 必须是 `READY_FOR_KICKOFF`
      - `primary_risk` 必须是 `LOW`
      - `first_milestone` 必须是 `api_sandbox_enablement`

      输出 payload 最低要求:
      - onboarding_id
      - onboarding_status
      - primary_risk
      - first_milestone
      - summary
      - `summary` 保持 1 句短句,不要补额外分析过程。
