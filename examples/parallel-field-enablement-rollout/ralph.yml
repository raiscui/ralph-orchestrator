  certification_tracker:
    name: "Certification Tracker"
    description: "确认认证计划与追踪节奏已就绪。"
    triggers: ["enablement.certification.plan.review"]
    publishes: ["certification.ready"]
    instances: 1
    instructions: |
      你是 `certification_tracker`。

      重要:
      - 不要运行任何工具或 shell 命令。
