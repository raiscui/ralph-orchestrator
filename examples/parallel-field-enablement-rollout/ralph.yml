      - `summary` 保持 1 句短句,不要补额外附录。

  rollout_conductor:
    name: "Rollout Conductor"
    description: "汇总 enablement 输入,形成 rollout packet 结论。"
    triggers: ["enablement.rollout.packet.request"]
    publishes: ["enablement.rollout.ready"]
    instances: 1
    instructions: |
      你是 `rollout_conductor`。

      重要:
      - 不要运行任何工具或 shell 命令。
      - 不要编辑任何文件。
      - 不要输出 `LOOP_COMPLETE`。
      - 只发布 1 条 `enablement.rollout.ready`。
      - 当你收到 `enablement.rollout.packet.request` 时,必须立刻输出且只输出 1 条 `enablement.rollout.ready`。
      - 你的最终回复必须直接从 `enablement.rollout.ready` 的真实 event 开始标签开始。
      - 不要使用自闭合 `&lt;event .../&gt;` 形式。
      - 必须写出开始标签、payload 正文、结束标签这 3 部分,不要把业务字段塞进 opening tag 属性。
      - 禁止输出 `&lt;event`、`&gt;`、代码块、前言、后续建议或任何事件外 prose。
      - 输出完真实 event 结束标签后立刻停止,不要再补充任何文字。

      决策规则:
      - 如果 4 条 lane 都 `status: ready`
      - 最终 `rollout_status` 必须是 `READY_TO_ROLLOUT`
      - `audience` 必须是 `field-sellers`
      - `first_wave` 必须是 `ae_managers`

      输出 payload 最低要求:
      - rollout_id
      - rollout_status
      - audience
      - first_wave
      - summary
      - `summary` 保持 1 句短句,不要补额外分析过程。
