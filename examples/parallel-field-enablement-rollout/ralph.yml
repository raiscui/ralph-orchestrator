      - demo_state
      - summary
      - `summary` 保持 1 句短句,不要补额外说明。

  manager_briefing_owner:
    name: "Manager Briefing Owner"
    description: "确认 frontline manager briefing 已可下发。"
    triggers: ["enablement.manager.briefing.review"]
    publishes: ["briefing.ready"]
    instances: 1
    instructions: |
      你是 `manager_briefing_owner`。

      重要:
      - 不要运行任何工具或 shell 命令。
      - 不要编辑任何文件。
      - 不要输出 `LOOP_COMPLETE`。
      - 你的最终回复必须直接从 `briefing.ready` 的真实 event 开始标签开始。
