# Parallel RevOps Quote Desk example
#
# 目标:
# - 演示营收运营报价台如何在 4 条 review lane 并行收口后统一生成 quote packet
# - 以明确的 topic 链和事件格式固定最终 quote.packet.ready payload

cli:
  backend: "codex"

event_loop:
  prompt_file: "PROMPT.md"
  ralph_prompt: |
    # Parallel RevOps Quote Desk

    你是并行模式下的 `ralph#1`（coordinator）。

    你的输入来自 `PROMPT.md` 的 `QUOTE_PACKET`，包含：
    - `## Deal Structure Packet`
    - `## Pricing Guardrail Packet`
    - `## Billing Setup Packet`
    - `## Commercial Terms Packet`

    ### 重要规则
    - `revops.quote.packet.request` 由你发出，`quote.packet.ready` 由 `quote_desk_lead` finalizer 发布。
    - 只有当所有 4 条 ready 事件都出现后，才允许发送 `revops.quote.packet.request`。
    - 在 `structure.ready` / `pricing.ready` / `billing.ready` / `terms.ready` 全部到齐之前必须保持完全静默。
    - `LOOP_COMPLETE` 只能在 `quote.packet.ready` 之后、你输出 final summary 的最后一行出现一次。
    - Worker / finalizer 只能通过 `&lt;event ...&gt;payload&lt;/event&gt;` 真实事件输出，禁止自闭合 `&lt;event .../&gt;` 或把字段塞进 opening tag 属性，也不要输出普通 prose、解释文本或 `LOOP_COMPLETE`。
    - `quote_status: READY_FOR_SELLER_HANDOFF`、`deal_motion: EXPANSION_UPSELL`、`pricing_owner: revops-desk` 是最终 payload 强约束。

    当你收到 `task.start` 时：
    1) 立即发布 4 条 review 请求，每条都必须包含：
       - `deal_id`
       - `lane`（结构/定价/结算/条款）
       - `review_packet`（引用对应 packet 段）
    2) 除非所有 ready 到齐，否则保持空输出，不要重复发任务，不要提 `LOOP_COMPLETE`。

    当你观察到：
    - `structure.ready`
    - `pricing.ready`
    - `billing.ready`
    - `terms.ready`
    全部出现后：
    - 你必须只发布一次 `revops.quote.packet.request`
    - 增加字段：
       - `quote_id`
       - `quote_summary` 简短描述各 lane 亮点
       - `quote_owner`

    当 4 条 ready 还没有全部到齐时:
    - 你必须保持完全静默
    - 不要输出任何等待说明、分析文本或 `LOOP_COMPLETE`
    - 不要重复发布已发过的 fanout 任务或 request

    当 `quote.packet.ready` 出现后：
    1) 输出一句 final summary（例如：`quote_desk_lead` 整体状态与下一步）。
    2) 最后一行独立输出 `LOOP_COMPLETE`，之后不要再发任何事件。

    发事件时请使用真实尖括号。下面只是展示文本:

    `&lt;event ...&gt;payload&lt;/event&gt;`

  completion_promise: "LOOP_COMPLETE"
  complete_publishes: "quote.packet.ready"
  max_iterations: 20
  max_runtime_seconds: 240

parallel:
  enabled: true
  autoscale:
    max_running_jobs: 6
    dynamic_idle_ttl_secs: 30
  permissions:
    worktree: allow
    hooks: allow

hats:
  deal_structure_reviewer:
    name: "Deal Structure Reviewer"
    description: "确认报价的 deal structure 与客户目标一致。"
    triggers: ["revops.deal.structure.review"]
    publishes: ["structure.ready"]
    instances: 1
    instructions: |
      你是 `deal_structure_reviewer`。

      重要:
      - 不要运行工具、不要编辑文件、不要输出 `LOOP_COMPLETE`。
      - 你的最终回复必须直接从真实 event `&lt;event topic="structure.ready"&gt;` 的开始标签开始。
      - 不要使用自闭合 `&lt;event .../&gt;` 形式，也不要把 payload 字段塞进 opening tag。
      - 只输出真实事件，禁止普通 prose、代码块或额外解释。
      - 输出完结束标签后立即停止。
      - payload 最低需要:
        - `deal_id`
        - `lane: structure`
        - `status: ready`
        - `structure_notes`

  pricing_guardrail_reviewer:
    name: "Pricing Guardrail Reviewer"
    description: "校验定价 guardrail 遵循性。"
    triggers: ["revops.pricing.guardrail.review"]
    publishes: ["pricing.ready"]
    instances: 1
    instructions: |
      你是 `pricing_guardrail_reviewer`。

      重要:
      - 同样禁止工具、文件改动、`LOOP_COMPLETE`、自闭合 `&lt;event .../&gt;` 和属性式 payload。
      - 只输出 `&lt;event topic="pricing.ready"&gt;...&lt;/event&gt;`，payload 中需包含:
        - `deal_id`
        - `lane: pricing`
        - `status: ready`
        - `guardrail_alignment`

  billing_setup_reviewer:
    name: "Billing Setup Reviewer"
    description: "确认账单设置与收款节点无误。"
    triggers: ["revops.billing.setup.review"]
    publishes: ["billing.ready"]
    instances: 1
    instructions: |
      你是 `billing_setup_reviewer`。

      重要:
      - 不运行工具、不编辑文件、不输出 `LOOP_COMPLETE`。
      - 输出必须直接从 `&lt;event topic="billing.ready"&gt;` 开始，并且结束标签必须精确写成 `&lt;/event&gt;`。
      - 禁止自闭合 `&lt;event .../&gt;` 与 attribute-only payload。
      - 整个回复必须是一条单行真实事件，不要拆成多行，不要写 YAML 列表，不要补空行。
      - payload 请使用紧凑 JSON 对象，`billing_sign_off` 只写一句短句。
      - payload 必须包含:
        - `deal_id`
        - `lane: billing`
        - `status: ready`
        - `billing_sign_off`

  commercial_terms_reviewer:
    name: "Commercial Terms Reviewer"
    description: "核对商业条款与合同约定。"
    triggers: ["revops.commercial.terms.review"]
    publishes: ["terms.ready"]
    instances: 1
    instructions: |
      你是 `commercial_terms_reviewer`。

      重要:
      - 禁止工具、文件修改、自闭合事件、LOOP_COMPLETE。
      - 你的回复必须只包含 `&lt;event topic="terms.ready"&gt;` 事件。
      - payload 至少包含:
        - `deal_id`
        - `lane: terms`
        - `status: ready`
        - `terms_exception`

  quote_desk_lead:
    name: "Quote Desk Lead"
    description: "汇总所有 lane 的 ready 结果,形成统一 quote packet。"
    triggers: ["revops.quote.packet.request"]
    publishes: ["quote.packet.ready"]
    instances: 1
    instructions: |
      你是 `quote_desk_lead`。

      重要:
      - 不要运行工具、不编辑文件、不输出 `LOOP_COMPLETE`。
      - 只用真实 `&lt;event topic="quote.packet.ready"&gt;` 事件输出最终 payload。
      - 禁止自闭合 `&lt;event .../&gt;` 与属性式 payload。
      - payload 里必须包含:
        - `quote_id`
        - `quote_summary`
        - `quote_owner`
        - `quote_status: READY_FOR_SELLER_HANDOFF`
        - `deal_motion: EXPANSION_UPSELL`
        - `pricing_owner: revops-desk`
        - `pricing_approval`
