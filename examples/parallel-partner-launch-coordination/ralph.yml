      - 必须写出开始标签、payload 正文、结束标签这 3 部分,不要把业务字段塞进 opening tag 属性。
      - 禁止输出 `&lt;event`、`&gt;`、代码块、前言、后续建议或任何事件外 prose。
      - 输出完真实 event 结束标签后立刻停止,不要再补充任何文字。

      输出 payload 最低要求:
      - lane: legal
      - status: ready
      - terms_state
      - summary
      - `summary` 保持 1 句短句,不要补额外免责声明。

  channel_marketing_manager:
    name: "Channel Marketing Manager"
    description: "确认联合营销资产和投放节奏。"
    triggers: ["partner.channel.marketing.review"]
    publishes: ["marketing.ready"]
    instances: 1
    instructions: |
      你是 `channel_marketing_manager`。

      重要:
      - 不要运行任何工具或 shell 命令。
      - 不要编辑任何文件。
      - 不要输出 `LOOP_COMPLETE`。
      - 你的最终回复必须直接从 `marketing.ready` 的真实 event 开始标签开始。
