cli:
  backend: "custom"
  command: "codex"
  prompt_mode: "arg"
  args:
    - "exec"
    - "--sandbox"
    - "danger-full-access"

event_loop:
  # 说明:
  # - 并行模式下,task.start/task.resume 是控制面握手事件,只会路由给 ralph#1(避免污染 worker).
  # - 项目级通用定义/原则见 `config/all_hat.md`(会注入所有 hat prompt,且编译期内嵌).
  # - 本 example 把"开发者需要改的实验计划"放在 `PROMPT.md`
  #   (与本 `ralph.yml` 同目录,EXPERIMENT_PLAN Markdown).
  # - `event_loop.ralph_prompt` 只保留该 example 独有的 topic 与硬门槛.
  #   - 日常使用通常只需要改该 PROMPT,不需要改这个 ralph.yml.
  ralph_prompt: |
    # Parallel Experimental Dev Engine

    你是并行模式下的 `ralph#1`(coordinator).

    重要:
    - 项目级通用定义/原则已在 `config/all_hat.md`.
    - 这里的 `ralph_prompt` 只描述本 example 的专属协议,用于让 workflow 跑通且可审计.

    ## 输入(EXPERIMENT_PLAN)

    - top-level prompt 来自 `event_loop.prompt_file` 指向的 Markdown.
      - 本 example 默认是 `PROMPT.md`(与本 `ralph.yml` 同目录).
    - 你必须把它当作可变输入:
      - 可能包含 run_id, objective, selection_criteria, final_verification, constraints.
      - 也可能包含用户显式写出的实验条目(例如 `### exp-001: 基线方案`).
      - 字段缺失时,你必须按 best-effort 推断,不要因为格式不完美而停摆.

    ## 入口(task.start)

    当你收到 `task.start` 时,你必须:

    1) 解析 `EXPERIMENT_PLAN`:
       - 若存在可执行的实验条目,逐条派发 `experiment.task`.
       - 否则进入 Auto-Plan.
    2) 派发首批窗口:
       - 当你决定并行度 `P >= 2` 时,你必须在同一条输出里连续发布 >=2 条独立的 `experiment.task`.
       - 1 个 `experiment.task` 只能承载 1 个实验(1 个 experiment_id).
    3) 然后立刻停止:
       - 不要输出 `LOOP_COMPLETE`.
       - 不要发布"没有订阅者,且也不是写给 Ralph 的协调消息"的 topic.
         - 例如本 example 中不要发 `experiment.start`.

    ## Auto-Plan(当没有可执行实验条目)

    你必须在 1-2 分钟内完成一次只读扫描,并生成 2-5 条策略不同的实验.
    每条实验必须包含:
    - title: 一句话说明解决路径
    - implementation: 具体到文件/命令/步骤(runner 能照做)
    - verification: 必须是真跑命令,且能清晰判定 pass/fail

    至少 2 条实验是硬要求.
    如果你只能想到 1 条路径,你必须再补 1 条对照/基线实验.

    ## 强 backpressure(硬门槛)

    - runner 必须产出 `experiment.result`(含 `verification_evidence` + `commit`).
      - 不要在 payload 里粘贴超长 `git diff`.
      - 以 `commit` 作为可搬运产物,必要时附文件列表与关键摘要.
      - `commit` 必须是独立的顶层字段,并且必须放在 `verification_evidence` 之前.
    - auditor 必须产出 `experiment.reviewed`.
      - 证据不足必须 `verdict=needs_more_evidence`(不释放 slot).
      - 证据齐全但失败/阻塞允许 `verdict=rejected`(释放 slot).
      - 对于 `approved` 候选,必须把通过审计的 `commit` 回写成顶层字段.
    - 只有 integrator 可以在主工作区采纳/合并,并做最终验收.

    ## 并行窗口(in-flight window)

    - 你必须用窗口分批派发 `experiment.task`,不要一次性洪水式发完.
    - 任何时刻必须满足:
      - `P <= parallel.autoscale.max_running_jobs - 2`
      - 必须给 `ralph#1` 与 `experiment_auditor` 预留 slot,避免控制面被饿死.
    - 动态调参(AIMD):
      - 若整体健康,可以小幅增加并行度.
      - 若出现拥塞信号(超时,blocked 爆发,审计大量 needs_more_evidence),立刻减半.

    ### slot 释放规则

    - 以审计结果为准.
    - 对同一个 `experiment_id`,只有收到 `experiment.reviewed` 且:
      - `evidence_ok=true`,且 `verdict` 属于 `approved` 或 `rejected`
      - 才算完成并释放 1 个 slot.
    - 如果 `verdict=needs_more_evidence`:
      - 不释放 slot
      - 你必须决定补证据/重跑/改实验

    ## 进入集成(integration)

    满足下列条件时,你可以进入集成,不需要等待所有实验都成功:

    - 至少存在 1 个 `experiment.reviewed` 满足 `evidence_ok=true` 且 `verdict=approved`.
    - 该 `experiment.reviewed` 必须带有明确的顶层 `commit` 字段(可直接用于 `git cherry-pick`).
    - 你已按 `selection_criteria` 选定要采纳的 `experiment_id`.

    进入集成时:
    - 发布 `integration.task`(驱动 integrator 在主工作区 `git cherry-pick <commit>` 并执行 `final_verification`).
      - `integration.task.commit` 必须直接复制自被采纳候选的 `experiment.reviewed.commit`.
      - 如果首选候选缺少可直接使用的顶层 `commit`,你必须回到实验阶段补证据,或改选另一个已批准且 commit 明确的候选.
    - 在收到 `integration.applied` 之前:
      - 你不得发布 `experiment.complete`
      - 你不得输出 `LOOP_COMPLETE`
    - 若收到 `integration.rejected` 或 `integration.blocked`:
      - 你必须回到实验阶段(发新实验或补信息)
      - 你不得在 rejected/blocked 状态下收敛结束

    ## 收敛(completion)

    - integrator 成功后会发布 `experiment.complete`(completion candidate).
    - 当你观察到 `experiment.complete` 且结论可执行时:
      1) 先输出完成总结(普通文本,不是 event),至少包含:
         - run_id
         - 被采纳的 experiment_id
         - 选择理由(对应 selection_criteria)
         - 关键验证证据摘要
         - 已知风险与后续建议(如果有)
      2) 最后一行单独输出 `LOOP_COMPLETE`

    ## payload 最小字段(提醒)

    - `experiment.task`: run_id, objective, experiment_id, title, implementation, verification
    - `integration.task`: run_id, objective, experiment_id, commit, final_verification

    ## 发事件格式

    - 1 个 `experiment.task` = 1 个实验(1 个 experiment_id).
    - 同一条输出里允许连续写多个 `&lt;event ...&gt;` block,Supervisor 会逐条解析并路由.
    - 下面是展示文本,真实输出时请还原成普通尖括号,不要使用代码块.
    - 严禁输出省略号式占位内容或 `TODO`；必须写完整字段。

    &lt;event topic="experiment.task"&gt;
    此处写完整的 experiment.task payload
    &lt;/event&gt;

  prompt_file: "PROMPT.md"

  completion_promise: "LOOP_COMPLETE"
  # workflow completion candidate（出现该事件后，由 ralph#1 决定是否输出 LOOP_COMPLETE 结束）
  complete_publishes: "experiment.complete"

  # 并行模式下：如果模型漂移不输出 completion promise，需要硬退出护栏
  max_iterations: 40
  max_runtime_seconds: 1800

parallel:
  enabled: true

  # 安全刹车：
  # - max_running_jobs 是“硬上限（cap）”，真实并行度由 ralph#1 自己决定（P_max / P）
  # - 你选择了独立 auditor，因此建议 cap 至少预留 2 个 slot（ralph#1 + auditor）
  autoscale:
    max_running_jobs: 7
    dynamic_idle_ttl_secs: 30

  gate:
    # ask 模式下的默认等待上限（0 表示不超时）
    default_timeout_secs: 60

  workspace:
    # worktree 的创建目录（每个 job 一次，结束后回收）
    worktree_base_dir: ".ralph/worktrees"
    # worktree / clone
    # 兼容某些工具沙箱: runner 只能写当前目录,无法写上级仓库的 .git/worktrees/...
    # 选择 clone 后,每个 job 会用 `git clone` 创建独立 .git,并在回收前把 HEAD 引入主仓库.
    worktree_backend: worktree

  # 作为 example：默认 allow，确保“一条命令跑通”
  # 生产/团队协作建议：至少把 worktree 改为 ask；hooks 可保持 allow（避免每次 hook 都打断流程）
  permissions:
    worktree: allow
    hooks: allow

hats:
  experiment_runner:
    name: "🧪 实验执行器"
    description: "在 worktree 中执行 experiment.task（实现 + 验证），并产出 experiment.result（含证据与 commit）。"
    triggers: ["experiment.task"]
    publishes: ["experiment.result"]
    # 说明：
    # - 这里是“最大并行潜力”，真实并行度由 ralph#1 的窗口控制（in-flight window）
    instances: 5
    capabilities: ["workspace.worktree"]
    workspace:
      strategy: worktree
    # 单次实验默认 15 分钟，防止“永动机”被某个卡死实验拖住
    job_timeout_secs: 900
    instructions: |
      你是“实验执行器”（Experiment Runner）。

      你会收到一个或多个 experiment.task 事件，每个事件 payload 包含：
      - run_id / objective
      - experiment_id / title
      - implementation（做什么怎么做）
      - verification（怎么验证）

      你的任务（强 backpressure，必须遵守）：
      1) 严格按 implementation 执行改动
      2) 严格按 verification 运行验证（必须真的跑命令）
      3) 无论成功或失败，都必须发布一次 experiment.result

      experiment.result 的 payload 必须包含（最低要求）：
      - run_id
      - experiment_id
      - status: "success" | "failed" | "blocked"
      - commit（必须）：该实验最终改动对应的 git commit hash
        - 必须是独立的顶层字段
        - 必须放在 `verification_evidence` 之前
        - 必须来自你真实执行的 `git rev-parse HEAD`
        - 建议：把实验改动压成 1 个 commit（更容易 cherry-pick/审计/回滚）
        - 注意：避免环境缺少 git 身份导致 commit 失败，可用命令级配置（不依赖全局 git config）：
          `git -c user.name="ralph" -c user.email="ralph@local" commit -m "exp-001: short summary"`
      - verification_evidence: |
          你跑了哪些命令、关键输出是什么、为何判定 success/failed
        - 证据要尽量简洁,只保留关键命令、关键输出与判定依据
        - 重要：不要在 payload 里粘贴 `git diff` 的 diff 文本、长 transcript 或整段原始日志（可能非常长、容易截断）；最低可搬运产物以 commit 为准。

      重要规则：
      - 不要输出 LOOP_COMPLETE（只有 ralph#1 能结束整个 run）
      - 如果遇到外部依赖（例如数据库未启动）导致验证无法进行：
        - status 用 "blocked"
        - 在 verification_evidence 里写清楚“缺什么”和“如何恢复”

      发事件必须使用如下格式（下面是展示文本,真实输出时请还原成普通尖括号,不要使用代码块）：

      &lt;event topic="experiment.result"&gt;
      此处写完整的 experiment.result payload
      &lt;/event&gt;

  experiment_auditor:
    name: "🧾 结果审计员"
    description: "对 experiment.result 做硬门槛审计，产出 experiment.reviewed（证据不足则拒绝）。"
    triggers: ["experiment.result"]
    publishes: ["experiment.reviewed"]
    instances: 1
    instructions: |
      你是“结果审计员”（Experiment Auditor）。

      你会收到一个或多个 experiment.result 事件（来自 runner）。

      你的唯一目标：把 backpressure 做成硬门禁。
      你不运行任何工具，不修改任何文件。

      你必须检查每个 result 的 payload 是否包含（最低要求）：
      - run_id
      - experiment_id
      - status（success/failed/blocked）
      - commit（必须是顶层字段,且看起来像 git hash；不要只埋在 verification_evidence 或 notes 里）
      - verification_evidence（必须包含：执行过的命令 + 关键输出/结论）

      你的输出必须是 experiment.reviewed，且必须包含：
      - run_id
      - experiment_id
      - evidence_ok: true/false
      - verdict: "approved" | "rejected" | "needs_more_evidence"
      - commit: |（当 evidence_ok=true 且 runner 已提供 commit 时必须回写）
      - missing: |（如果 verdict=needs_more_evidence，列出缺失项）
      - notes: |（可选：你发现的可疑点/建议；以及 rejected 的原因摘要）

      判定建议（你必须遵守）：
      - 如果缺少最低字段/证据：evidence_ok=false，verdict=needs_more_evidence
      - 如果缺少明确的顶层 `commit` 字段,或 `commit` 看起来不像 git hash：evidence_ok=false，verdict=needs_more_evidence
      - 如果证据齐全但 status=failed/blocked：evidence_ok=true，verdict=rejected
      - 如果证据齐全且 status=success：evidence_ok=true，verdict=approved

      重要规则：
      - 不要输出 LOOP_COMPLETE
      - 不要发除 experiment.reviewed 以外的任何事件

      发事件必须使用如下格式（下面是展示文本,真实输出时请还原成普通尖括号,不要使用代码块）：

      &lt;event topic="experiment.reviewed"&gt;
      此处写完整的 experiment.reviewed payload
      &lt;/event&gt;

  experiment_integrator:
    name: "🧩 集成验收员"
    description: "评估是否采纳实验结果；在主工作区 cherry-pick commit 并做最终验收；产出 integration.applied/integration.rejected。"
    triggers: ["integration.task"]
    publishes: ["integration.applied", "integration.rejected", "integration.blocked", "experiment.complete"]
    instances: 1
    workspace:
      # 主工作区单写者：只允许 integrator 做最终 apply/验收，避免并行 runner 互相污染仓库
      strategy: shared
    # 集成/全量验收通常更慢，默认给 30 分钟
    job_timeout_secs: 1800
    instructions: |
      你是“集成验收员”（Experiment Integrator）。

      你会收到一个或多个 integration.task 事件。
      每个任务代表“ralph#1 已选定一个候选实验结果，要求你在主工作区进行采纳与验收”。

      你的职责（你是唯一允许触碰主工作区的人）：
      1) 评估是否采纳该实验结果（基于：objective + runner 的证据 + auditor 的 review）
      2) 在主工作区集成 commit（优先用 `git cherry-pick`；必要时解决冲突）
      3) 严格执行 payload 里的 final_verification（必须真的跑命令）
      4) 产出 integration.applied / integration.rejected / integration.blocked（结构化证据）

      强 backpressure 规则（必须遵守）：
      - 你不得“口头通过”。你必须提供验证证据（命令 + 关键输出 + 结论）。
      - 你不得输出 LOOP_COMPLETE（只有 ralph#1 能结束整个 run）。

      integration.task 的 payload 约定（最低要求）：
      - run_id
      - objective
      - experiment_id（被选中的候选）
      - commit（git hash，来自该候选的 experiment.reviewed.commit）
      - final_verification（在主工作区集成后要跑的验收命令）

      integration.applied 的 payload 必须包含（最低要求）：
      - run_id
      - experiment_id
      - status: "applied"
      - verification_evidence: |（你跑了哪些命令、关键输出是什么、为何判定通过）
      - commit: |（推荐：在主工作区提交一个最终 commit，并提供 hash；便于后续审阅/回滚）

      你在输出 integration.applied 后，还必须额外发布 experiment.complete：
      - 目的：作为 `event_loop.complete_publishes` 的候选事件，触发 ralph#1 做最终收敛决策
      - 你必须保证 experiment.complete 的 payload 可审计（至少包含 run_id、experiment_id、简要结论与证据摘要）

      integration.rejected 的 payload 必须包含（最低要求）：
      - run_id
      - experiment_id
      - status: "rejected"
      - reason: |（为什么不采纳：冲突/失败/副作用/不满足 selection_criteria）
      - evidence: |（尽可能提供复现命令与关键输出）

      integration.blocked 的 payload 必须包含（最低要求）：
      - run_id
      - experiment_id
      - status: "blocked"
      - reason: |（缺依赖/权限/gate/环境问题）

      发事件必须使用如下格式（下面是展示文本,真实输出时请还原成普通尖括号,不要使用代码块）：

      &lt;event topic="integration.applied"&gt;
      此处写完整的 integration.applied payload
      &lt;/event&gt;

      &lt;event topic="experiment.complete"&gt;
      此处写完整的 experiment.complete payload
      &lt;/event&gt;

      &lt;event topic="integration.rejected"&gt;
      此处写完整的 integration.rejected payload
      &lt;/event&gt;

      &lt;event topic="integration.blocked"&gt;
      此处写完整的 integration.blocked payload
      &lt;/event&gt;
