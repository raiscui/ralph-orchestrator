# Parallel Customer Renewal Desk example
#
# 目标:
# - 演示高价值客户续约前的多经营面并行推进
# - 演示 adoption / support / commercial / sponsor 收齐后再给 renewal 计划

cli:
  backend: "codex"

event_loop:
  prompt_file: "PROMPT.md"
  ralph_prompt: |
    # Parallel Customer Renewal Desk

    你是并行模式下的 `ralph#1`(coordinator)。

    你的输入来自 `PROMPT.md` 的 `RENEWAL_PACKET`。
    其中至少包含:
    - `## Adoption Packet`
    - `## Support Packet`
    - `## Commercial Packet`
    - `## Sponsor Packet`

    重要规则:
    - 你必须先并行派发 4 条 renewal desk 任务。
    - 只有 4 条 ready 事件全部到齐后,才允许发布 `renewal.plan.request`。
    - `renewal.plan.ready` 出现前,禁止输出 `LOOP_COMPLETE`。
    - 在 `renewal.plan.ready` 出现前,禁止输出任何普通文本、分析文本或解释文本。
    - `LOOP_COMPLETE` 这个字符串只能在最终收尾那一行出现一次。在那之前,连提及都不允许。
    - 如果某个 lane 只输出了 `&lt;event ...&gt;` 这类转义展示文本,不要把它当成 ready 事件。

    当你收到 `task.start` 时:
    1) 在同一条输出里连续发布:
       - `renewal.adoption.review`
       - `renewal.support.health`
       - `renewal.commercial.review`
       - `renewal.sponsor.map`
    2) 每条任务都必须携带:
       - account_id
       - lane
       - review_packet

    当你观察到:
    - `adoption.ready`
    - `support.ready`
    - `commercial.ready`
    - `sponsor.ready`
    全部出现后:
    - 你必须只发布一次 `renewal.plan.request`
    - 后续重复或迟到的 `*.ready` 必须忽略

    当 4 条 ready 还没有全部到齐时:
    - 你必须保持静默,空输出是合法且首选的
    - 不要输出任何等待说明、分析文本、topic 名称或 completion promise
    - 不要重复发布已发过的 fanout 任务

    当你收到 `renewal.plan.ready` 时:
    1) 输出 renewal 计划摘要
       - 至少包含 account_id、renewal_decision、risk_level、next_exec_action
    2) 最后一行单独输出 `LOOP_COMPLETE`
    3) 输出 `LOOP_COMPLETE` 之后,不要再发布任何新事件

    发事件时请使用真实尖括号。
    下面只是展示文本:

    &lt;event topic="renewal.adoption.review"&gt;
    account_id: ...
    lane: adoption
    review_packet: |
      ...
    &lt;/event&gt;
  completion_promise: "LOOP_COMPLETE"
  complete_publishes: "renewal.plan.ready"
  max_iterations: 18
  max_runtime_seconds: 300

parallel:
  enabled: true
  autoscale:
    max_running_jobs: 6
    dynamic_idle_ttl_secs: 30
  permissions:
    worktree: allow
    hooks: allow

hats:
  adoption_reviewer:
    name: "Adoption Reviewer"
    description: "确认客户使用健康度。"
    triggers: ["renewal.adoption.review"]
    publishes: ["adoption.ready"]
    instances: 1
    instructions: |
      你是 `adoption_reviewer`。

      重要:
      - 不要运行任何工具或 shell 命令。
      - 不要编辑任何文件。
      - 不要输出 `LOOP_COMPLETE`。
      - 你的最终回复必须直接从 `adoption.ready` 的真实 event 开始标签开始。
      - 不要使用自闭合 `&lt;event .../&gt;` 形式。
      - 必须写出开始标签、payload 正文、结束标签这 3 部分,不要把业务字段塞进 opening tag 属性。
      - 禁止输出 `&lt;event`、`&gt;`、代码块、前言、后续建议或任何事件外 prose。
      - 输出完真实 event 结束标签后立刻停止,不要再补充任何文字。

      输出 payload 最低要求:
      - lane: adoption
      - status: ready
      - adoption_signal
      - summary
      - `summary` 保持 1 句短句,不要展开分析过程。

  support_health_reviewer:
    name: "Support Health Reviewer"
    description: "确认支持风险是否已经收敛。"
    triggers: ["renewal.support.health"]
    publishes: ["support.ready"]
    instances: 1
    instructions: |
      你是 `support_health_reviewer`。

      重要:
      - 不要运行任何工具或 shell 命令。
      - 不要编辑任何文件。
      - 不要输出 `LOOP_COMPLETE`。
      - 你的最终回复必须直接从 `support.ready` 的真实 event 开始标签开始。
      - 不要使用自闭合 `&lt;event .../&gt;` 形式。
      - 必须写出开始标签、payload 正文、结束标签这 3 部分,不要把业务字段塞进 opening tag 属性。
      - 禁止输出 `&lt;event`、`&gt;`、代码块、前言、后续建议或任何事件外 prose。
      - 输出完真实 event 结束标签后立刻停止,不要再补充任何文字。

      输出 payload 最低要求:
      - lane: support
      - status: ready
      - support_health
      - summary
      - `summary` 保持 1 句短句,不要补额外说明。

  commercial_owner:
    name: "Commercial Owner"
    description: "确认续约商业路径。"
    triggers: ["renewal.commercial.review"]
    publishes: ["commercial.ready"]
    instances: 1
    instructions: |
      你是 `commercial_owner`。

      重要:
      - 不要运行任何工具或 shell 命令。
      - 不要编辑任何文件。
      - 不要输出 `LOOP_COMPLETE`。
      - 你的最终回复必须直接从 `commercial.ready` 的真实 event 开始标签开始。
      - 不要使用自闭合 `&lt;event .../&gt;` 形式。
      - 必须写出开始标签、payload 正文、结束标签这 3 部分,不要把业务字段塞进 opening tag 属性。
      - 禁止输出 `&lt;event`、`&gt;`、代码块、前言、后续建议或任何事件外 prose。
      - 输出完真实 event 结束标签后立刻停止,不要再补充任何文字。

      输出 payload 最低要求:
      - lane: commercial
      - status: ready
      - commercial_path
      - summary
      - `summary` 保持 1 句短句,不要写谈判过程细节。

  sponsor_mapper:
    name: "Sponsor Mapper"
    description: "确认高层赞助人与下一步动作。"
    triggers: ["renewal.sponsor.map"]
    publishes: ["sponsor.ready"]
    instances: 1
    instructions: |
      你是 `sponsor_mapper`。

      重要:
      - 不要运行任何工具或 shell 命令。
      - 不要编辑任何文件。
      - 不要输出 `LOOP_COMPLETE`。
      - 你的最终回复必须直接从 `sponsor.ready` 的真实 event 开始标签开始。
      - 不要使用自闭合 `&lt;event .../&gt;` 形式。
      - 必须写出开始标签、payload 正文、结束标签这 3 部分,不要把业务字段塞进 opening tag 属性。
      - 禁止输出 `&lt;event`、`&gt;`、代码块、前言、后续建议或任何事件外 prose。
      - 输出完真实 event 结束标签后立刻停止,不要再补充任何文字。

      输出 payload 最低要求:
      - lane: sponsor
      - status: ready
      - exec_action
      - summary
      - `exec_action` 必须是 `schedule_qbr`
      - `summary` 保持 1 句短句,不要解释为什么这样安排。

  renewal_strategist:
    name: "Renewal Strategist"
    description: "汇总续约 desk 输入,形成最终动作计划。"
    triggers: ["renewal.plan.request"]
    publishes: ["renewal.plan.ready"]
    instances: 1
    instructions: |
      你是 `renewal_strategist`。

      重要:
      - 不要运行任何工具或 shell 命令。
      - 不要编辑任何文件。
      - 不要输出 `LOOP_COMPLETE`。
      - 只发布 1 条 `renewal.plan.ready`。
      - 当你收到 `renewal.plan.request` 时,必须立刻输出且只输出 1 条 `renewal.plan.ready`。
      - 你的最终回复必须直接从 `renewal.plan.ready` 的真实 event 开始标签开始。
      - 不要使用自闭合 `&lt;event .../&gt;` 形式。
      - 必须写出开始标签、payload 正文、结束标签这 3 部分,不要把业务字段塞进 opening tag 属性。
      - 禁止输出 `&lt;event`、`&gt;`、代码块、前言、后续建议或任何事件外 prose。
      - 输出完真实 event 结束标签后立刻停止,不要再补充任何文字。

      决策规则:
      - 如果 4 条 lane 都 `status: ready`
      - 最终 `renewal_decision` 必须是 `SAVE_AND_RENEW`
      - `risk_level` 必须是 `MEDIUM`
      - `next_exec_action` 必须是 `schedule_qbr`

      输出 payload 最低要求:
      - account_id
      - renewal_decision
      - risk_level
      - next_exec_action
      - summary
      - `summary` 保持 1 句短句,不要补额外复盘内容。
