# Parallel Postmortem Action Board example
#
# 目标:
# - 演示事故复盘后的多输入线并行收敛
# - 演示 timeline / root cause / actions / customer recap 收齐后再生成 action board

cli:
  backend: "codex"

event_loop:
  prompt_file: "PROMPT.md"
  ralph_prompt: |
    # Parallel Postmortem Action Board

    你是并行模式下的 `ralph#1`(coordinator)。

    你的输入来自 `PROMPT.md` 的 `POSTMORTEM_PACKET`。
    其中至少包含:
    - `## Timeline Packet`
    - `## Root Cause Packet`
    - `## Action Mapping Packet`
    - `## Customer Recap Packet`

    重要规则:
    - 你必须先并行派发 4 条复盘任务。
    - 只有 4 条 ready 事件全部到齐后,才允许发布 `pm.board.request`。
    - `postmortem.board.ready` 出现前,禁止输出 `LOOP_COMPLETE`。
    - 在 `postmortem.board.ready` 出现前,禁止输出任何普通文本、分析文本或解释文本。
    - `LOOP_COMPLETE` 这个字符串只能在最终收尾那一行出现一次。在那之前,连提及都不允许。
    - 如果某个 lane 只输出了 `&lt;event ...&gt;` 这类转义展示文本,不要把它当成 ready 事件。

    当你收到 `task.start` 时:
    1) 在同一条输出里连续发布:
       - `pm.timeline.build`
       - `pm.root_cause.review`
       - `pm.action.map`
       - `pm.customer.recap`
    2) 每条任务都必须携带:
       - postmortem_id
       - lane
       - evidence_packet

    当你观察到:
    - `timeline.ready`
    - `root_cause.ready`
    - `actions.ready`
    - `customer.recap.ready`
    全部出现后:
    - 你必须只发布一次 `pm.board.request`
    - 后续重复或迟到的 `*.ready` 必须忽略

    当 4 条 ready 还没有全部到齐时:
    - 你必须保持静默,空输出是合法且首选的
    - 不要输出任何等待说明、分析文本、topic 名称或 completion promise
    - 不要重复发布已发过的 fanout 任务

    当你收到 `postmortem.board.ready` 时:
    1) 输出 action board 摘要
       - 至少包含 postmortem_id、status、top_action、owner
    2) 最后一行单独输出 `LOOP_COMPLETE`
    3) 输出 `LOOP_COMPLETE` 之后,不要再发布任何新事件

    发事件时请使用真实尖括号。
    下面只是展示文本:

    &lt;event topic="pm.timeline.build"&gt;
    postmortem_id: ...
    lane: timeline
    evidence_packet: |
      ...
    &lt;/event&gt;
  completion_promise: "LOOP_COMPLETE"
  complete_publishes: "postmortem.board.ready"
  max_iterations: 18
  max_runtime_seconds: 300

parallel:
  enabled: true
  autoscale:
    max_running_jobs: 6
    dynamic_idle_ttl_secs: 30
  permissions:
    worktree: allow
    hooks: allow

hats:
  timeline_curator:
    name: "Timeline Curator"
    description: "整理事故时间线与关键拐点。"
    triggers: ["pm.timeline.build"]
    publishes: ["timeline.ready"]
    instances: 1
    instructions: |
      你是 `timeline_curator`。

      重要:
      - 不要运行任何工具或 shell 命令。
      - 不要编辑任何文件。
      - 不要输出 `LOOP_COMPLETE`。
      - 你的最终回复必须直接从 `timeline.ready` 的真实 event 开始标签开始。
      - 禁止输出 `&lt;event`、`&gt;`、代码块、前言、后续建议或任何事件外 prose。
      - 输出完真实 event 结束标签后立刻停止,不要再补充任何文字。

      输出 payload 最低要求:
      - lane: timeline
      - status: ready
      - anchor_event
      - summary
      - `summary` 保持 1 句短句,不要写分析过程。

  root_cause_editor:
    name: "Root Cause Editor"
    description: "收敛根因与触发链路。"
    triggers: ["pm.root_cause.review"]
    publishes: ["root_cause.ready"]
    instances: 1
    instructions: |
      你是 `root_cause_editor`。

      重要:
      - 不要运行任何工具或 shell 命令。
      - 不要编辑任何文件。
      - 不要输出 `LOOP_COMPLETE`。
      - 你的最终回复必须直接从 `root_cause.ready` 的真实 event 开始标签开始。
      - 禁止输出 `&lt;event`、`&gt;`、代码块、前言、后续建议或任何事件外 prose。
      - 输出完真实 event 结束标签后立刻停止,不要再补充任何文字。

      输出 payload 最低要求:
      - lane: root_cause
      - status: ready
      - root_cause
      - summary
      - `summary` 保持 1 句短句,不要写“现象/假设/验证/结论”长段展开。

  action_owner_mapper:
    name: "Action Owner Mapper"
    description: "把行动项映射到 owner 和截止时间。"
    triggers: ["pm.action.map"]
    publishes: ["actions.ready"]
    instances: 1
    instructions: |
      你是 `action_owner_mapper`。

      重要:
      - 不要运行任何工具或 shell 命令。
      - 不要编辑任何文件。
      - 不要输出 `LOOP_COMPLETE`。
      - 你的最终回复必须直接从 `actions.ready` 的真实 event 开始标签开始。
      - 禁止输出 `&lt;event`、`&gt;`、代码块、前言、后续建议或任何事件外 prose。
      - 输出完真实 event 结束标签后立刻停止,不要再补充任何文字。

      输出 payload 最低要求:
      - lane: actions
      - status: ready
      - top_action
      - owner
      - due_date
      - summary
      - `top_action` 必须是 `add_completion_promise_guardrail`
      - `owner` 必须是 `runtime-platform`
      - `due_date` 必须是 `2026-05-15`
      - `summary` 保持 1 句短句,不要解释为什么你这样填写。

  customer_recap_writer:
    name: "Customer Recap Writer"
    description: "整理外部沟通复盘摘要。"
    triggers: ["pm.customer.recap"]
    publishes: ["customer.recap.ready"]
    instances: 1
    instructions: |
      你是 `customer_recap_writer`。

      重要:
      - 不要运行任何工具或 shell 命令。
      - 不要编辑任何文件。
      - 不要输出 `LOOP_COMPLETE`。
      - 你的最终回复必须直接从 `customer.recap.ready` 的真实 event 开始标签开始。
      - 禁止输出 `&lt;event`、`&gt;`、代码块、前言、后续建议或任何事件外 prose。
      - 输出完真实 event 结束标签后立刻停止,不要再补充任何文字。

      输出 payload 最低要求:
      - lane: customer_recap
      - status: ready
      - customer_message
      - summary
      - `summary` 保持 1 句短句,不要写额外 bullet 或附录。

  board_facilitator:
    name: "Board Facilitator"
    description: "汇总复盘输入,形成 action board。"
    triggers: ["pm.board.request"]
    publishes: ["postmortem.board.ready"]
    instances: 1
    instructions: |
      你是 `board_facilitator`。

      重要:
      - 不要运行任何工具或 shell 命令。
      - 不要编辑任何文件。
      - 不要输出 `LOOP_COMPLETE`。
      - 只发布 1 条 `postmortem.board.ready`。
      - 当你收到 `pm.board.request` 时,必须立刻输出且只输出 1 条 `postmortem.board.ready`。
      - 你的最终回复必须直接从 `postmortem.board.ready` 的真实 event 开始标签开始。
      - 禁止输出 `&lt;event`、`&gt;`、代码块、前言、后续建议或任何事件外 prose。
      - 输出完真实 event 结束标签后立刻停止,不要再补充任何文字。

      决策规则:
      - 如果 4 条 lane 都 `status: ready`
      - 最终 `status` 必须是 `READY_FOR_REVIEW`
      - `top_action` 必须是 `add_completion_promise_guardrail`
      - `owner` 必须是 `runtime-platform`
      - `due_date` 必须是 `2026-05-15`

      输出 payload 最低要求:
      - postmortem_id
      - status
      - top_action
      - owner
      - due_date
      - summary
      - `summary` 保持 1 句短句,不要补额外分析过程。
