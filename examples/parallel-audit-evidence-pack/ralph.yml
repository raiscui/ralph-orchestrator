# Parallel Audit Evidence Pack example
#
# 目标:
# - 演示审计前证据收集的多输入线并行推进
# - 演示 access / change log / backup / incident history 收齐后再生成 auditor packet

cli:
  backend: "codex"

event_loop:
  prompt_file: "PROMPT.md"
  ralph_prompt: |
    # Parallel Audit Evidence Pack

    你是并行模式下的 `ralph#1`(coordinator)。

    你的输入来自 `PROMPT.md` 的 `AUDIT_PACKET`。
    其中至少包含:
    - `## Access Evidence Packet`
    - `## Change Log Packet`
    - `## Backup Verification Packet`
    - `## Incident History Packet`

    重要规则:
    - 你必须先并行派发 4 条 audit evidence 任务。
    - 只有 4 条 ready 事件全部到齐后,才允许发布 `audit.packet.request`。
    - `audit.packet.ready` 出现前,禁止输出 `LOOP_COMPLETE`。
    - 在 `audit.packet.ready` 出现前,禁止输出任何普通文本、分析文本或解释文本。
    - `LOOP_COMPLETE` 这个字符串只能在最终收尾那一行出现一次。在那之前,连提及都不允许。
    - 如果某个 lane 只输出了 `&lt;event ...&gt;` 这类转义展示文本,不要把它当成 ready 事件。

    当你收到 `task.start` 时:
    1) 在同一条输出里连续发布:
       - `audit.access.export`
       - `audit.change.log.collect`
       - `audit.backup.verify`
       - `audit.incident.history.collect`
    2) 每条任务都必须携带:
       - audit_id
       - lane
       - evidence_packet

    当你观察到:
    - `access.evidence.ready`
    - `change.evidence.ready`
    - `backup.evidence.ready`
    - `incident.evidence.ready`
    全部出现后:
    - 你必须只发布一次 `audit.packet.request`
    - 后续重复或迟到的 `*.ready` 必须忽略

    当 4 条 ready 还没有全部到齐时:
    - 你必须保持静默,空输出是合法且首选的
    - 不要输出任何等待说明、分析文本、topic 名称或 completion promise
    - 不要重复发布已发过的 fanout 任务

    当你收到 `audit.packet.ready` 时:
    1) 输出 audit packet 摘要
       - 至少包含 audit_id、audit_status、control_set、owner
    2) 最后一行单独输出 `LOOP_COMPLETE`
    3) 输出 `LOOP_COMPLETE` 之后,不要再发布任何新事件

    发事件时请使用真实尖括号。
    下面只是展示文本:

    &lt;event topic="audit.access.export"&gt;
    audit_id: ...
    lane: access
    evidence_packet: |
      ...
    &lt;/event&gt;
  completion_promise: "LOOP_COMPLETE"
  complete_publishes: "audit.packet.ready"
  max_iterations: 18
  max_runtime_seconds: 300

parallel:
  enabled: true
  autoscale:
    max_running_jobs: 6
    dynamic_idle_ttl_secs: 30
  permissions:
    worktree: allow
    hooks: allow

hats:
  access_exporter:
    name: "Access Exporter"
    description: "导出访问审查证据。"
    triggers: ["audit.access.export"]
    publishes: ["access.evidence.ready"]
    instances: 1
    instructions: |
      你是 `access_exporter`。

      重要:
      - 不要运行任何工具或 shell 命令。
      - 不要编辑任何文件。
      - 不要输出 `LOOP_COMPLETE`。
      - 你的最终回复必须直接从 `access.evidence.ready` 的真实 event 开始标签开始。
      - 不要使用自闭合 `&lt;event .../&gt;` 形式。
      - 必须写出开始标签、payload 正文、结束标签这 3 部分,不要把业务字段塞进 opening tag 属性。
      - 禁止输出 `&lt;event`、`&gt;`、代码块、前言、后续建议或任何事件外 prose。
      - 输出完真实 event 结束标签后立刻停止,不要再补充任何文字。

      输出 payload 最低要求:
      - lane: access
      - status: ready
      - access_export_window
      - summary
      - `summary` 保持 1 句短句,不要扩展成 checklist。

